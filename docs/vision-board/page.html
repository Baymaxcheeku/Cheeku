<title>Cheeku Vision Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a mission-control timeline. Lanes run down, quarters run across, the live model rides along the top. */
:root {
  --bg: #F5F4FB; --surface: #FFFFFF; --surface-2: #EEECF9; --surface-3: #E4E1F6;
  --ink: #15143A; --muted: #66658A; --faint: #9A98BB; --line: #E1DEF2; --line-2: #CFCBEA;
  --accent: #5B4EF0; --accent-2: #3B2BC9; --accent-soft: #E7E4FE; --on-accent: #FFFFFF;
  --lime: #E4FF7A; --lime-ink: #2F3D00; --navy: #14136B; --on-navy: #FFFFFF;
  --good: #1F9D63; --warn: #D98A12; --bad: #D33A4E; --risk: #E2603B;
  --l-product: #5B4EF0; --l-ai: #0B9C9C; --l-supply: #3C9A4B; --l-growth: #DB8418; --l-revenue: #D3478C;
  --l-b2b: #2F6FDE; --l-funding: #9A6A2A; --l-team: #6C6F86; --l-trust: #C94A1C;
  --o-athar: #5B4EF0; --o-suraj: #0B8F80; --o-deepesh: #D56A12;
  --shadow: 0 1px 2px rgba(30, 24, 90, .06), 0 6px 18px rgba(30, 24, 90, .06);
  --display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --colw: 196px; --railw: 176px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E1C; --surface: #171629; --surface-2: #1E1D36; --surface-3: #282645;
  --ink: #EDECFB; --muted: #A4A2C6; --faint: #6E6C93; --line: #2A2946; --line-2: #393760;
  --accent: #8F87FF; --accent-2: #B4AEFF; --accent-soft: #29265A; --on-accent: #0E0E1C;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2A2880; --on-navy: #FFFFFF;
  --good: #3CC184; --warn: #F0AE3A; --bad: #F06A7C; --risk: #F38A62;
  --l-product: #9A92FF; --l-ai: #35C9C6; --l-supply: #67C576; --l-growth: #F2A646; --l-revenue: #F07AB5;
  --l-b2b: #6FA0FF; --l-funding: #D2A262; --l-team: #A3A6BE; --l-trust: #F07D50;
  --o-athar: #9A92FF; --o-suraj: #36C2AE; --o-deepesh: #F29A4A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.3);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E0E1C; --surface: #171629; --surface-2: #1E1D36; --surface-3: #282645;
  --ink: #EDECFB; --muted: #A4A2C6; --faint: #6E6C93; --line: #2A2946; --line-2: #393760;
  --accent: #8F87FF; --accent-2: #B4AEFF; --accent-soft: #29265A; --on-accent: #0E0E1C;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2A2880; --on-navy: #FFFFFF;
  --good: #3CC184; --warn: #F0AE3A; --bad: #F06A7C; --risk: #F38A62;
  --l-product: #9A92FF; --l-ai: #35C9C6; --l-supply: #67C576; --l-growth: #F2A646; --l-revenue: #F07AB5;
  --l-b2b: #6FA0FF; --l-funding: #D2A262; --l-team: #A3A6BE; --l-trust: #F07D50;
  --o-athar: #9A92FF; --o-suraj: #36C2AE; --o-deepesh: #F29A4A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.3);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--ui); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font: italic 400 28px/1 var(--display); color: var(--accent); letter-spacing: -.3px; }
.brand span { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 10px; overflow-x: auto; max-width: 100%; }
.tabs a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.peers { display: flex; }
.peers img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; background: var(--surface-2); }
.chip-ro { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.sync.live { background: var(--good); } .sync.err { background: var(--bad); }
.btn { border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Levers */
.levers { background: var(--surface); border-bottom: 1px solid var(--line); }
.levers-in { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.lever { display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center; min-width: 150px; }
.lever label { font-size: 12px; color: var(--muted); font-weight: 600; }
.lever output { font-size: 12px; font-weight: 700; text-align: right; }
.lever input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.whatif { display: none; align-items: center; gap: 10px; background: var(--lime); color: var(--lime-ink); padding: 6px 10px 6px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; }
.whatif.on { display: inline-flex; }
.whatif .btn { padding: 4px 10px; background: var(--surface); color: var(--ink); border-color: transparent; }
.levers-toggle { margin-left: auto; }

/* Filters */
.filters-in { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 7px 11px; min-width: 180px; flex: 0 1 240px; }
.fchip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ftoggle { display: none; }
@media (max-width: 700px) { .ftoggle { display: inline-flex; } .filters-in .fmore { display: none; } .filters.open .filters-in .fmore { display: contents; } }
.fmore { display: contents; }
.fsep { width: 1px; height: 20px; background: var(--line-2); margin-inline: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* Board grid */
.board-scroll { overflow: auto; max-height: calc(100vh - 210px); min-height: 420px; border-top: 1px solid var(--line); position: relative; }
.grid { display: grid; position: relative; }
.hcell { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px 8px; }
.hcell.now { background: var(--accent-soft); }
.hcell .plabel { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.hcell .plabel b { font: 400 24px/1 var(--display); }
.hcell .plabel small { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.ribbon { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 8px; font-size: 11.5px; }
.ribbon span { color: var(--muted); }
.ribbon b { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.ribbon b.neg { color: var(--bad); }
.revbar { height: 4px; border-radius: 3px; background: var(--surface-3); margin-top: 7px; overflow: hidden; }
.revbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.events { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; min-height: 20px; }
.ev { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--navy); color: var(--on-navy); white-space: nowrap; }
.ev.lime { background: var(--lime); color: var(--lime-ink); }
.corner { position: sticky; left: 0; top: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.corner b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rail { position: sticky; left: 0; z-index: 5; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.rail .lname { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; line-height: 1.2; }
.rail .lsw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.rail .lcount { font-size: 12px; color: var(--muted); }
.rail .lbar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--surface-3); }
.cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 92px; position: relative; }
.cell.alt { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.cell.now { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.cell.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.cell .add { opacity: 0; align-self: flex-start; border: 1px dashed var(--line-2); background: transparent; border-radius: 8px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
.cell:hover .add, .cell .add:focus-visible { opacity: 1; }
.collapsed .cell { min-height: 0; padding-block: 6px; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px 7px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 5px; position: relative; }
.card:hover { border-color: var(--line-2); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.card.rel { border-color: var(--warn); }
.card.st-done { opacity: .72; }
.card.st-done .ctitle { text-decoration: line-through; text-decoration-color: var(--faint); }
.card.st-dropped { opacity: .45; }
.card.st-at_risk { border-color: color-mix(in srgb, var(--risk) 60%, var(--line)); }
.card.st-blocked { border-color: color-mix(in srgb, var(--bad) 70%, var(--line)); }
.ctop { display: flex; gap: 6px; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.glyph { width: 10px; height: 10px; flex: none; }
.ctitle { font-weight: 600; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
.cfoot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pri { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 5px; background: var(--surface-3); color: var(--muted); }
.pri.P0 { background: var(--ink); color: var(--bg); }
.auto { margin-left: auto; display: inline-flex; gap: 3px; align-items: center; color: var(--accent); }
.av { width: 20px; height: 20px; border-radius: 50%; font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; color: #fff; flex: none; }
.av.athar { background: var(--o-athar); } .av.suraj { background: var(--o-suraj); } .av.deepesh { background: var(--o-deepesh); }
.av.none { background: var(--surface-3); color: var(--muted); }
:root[data-theme="dark"] .av:not(.none), :root:not([data-theme="light"]) .av:not(.none) { color: #fff; }
.tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-idea { background: var(--faint); } .s-planned { background: var(--accent); } .s-in_progress { background: var(--warn); }
.s-done { background: var(--good); } .s-at_risk { background: var(--risk); } .s-blocked { background: var(--bad); } .s-dropped { background: var(--line-2); }
.editing-by { position: absolute; top: -8px; right: -6px; }
.editing-by img { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); }
.span { font-size: 11px; color: var(--muted); font-weight: 600; }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 40; display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(20, 16, 60, .18); transform: translateX(102%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dhead h2 { font: italic 400 26px/1 var(--display); flex: 1; min-width: 0; }
.dbody { overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.dfoot { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .flabel { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input[type=text], .field input[type=number], .field select, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gatebox { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.lands { font-size: 13px; font-weight: 600; color: var(--accent-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; background: transparent; opacity: .5; }
.tchip[aria-pressed="true"] { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
.deplist { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; padding: 6px; }
.deplist label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 4px; border-radius: 6px; }
.deplist label:hover { background: var(--surface-2); }
.meta { font-size: 12px; color: var(--muted); }
.confirm { display: none; gap: 8px; align-items: center; }
.confirm.on { display: inline-flex; }
.scrim { position: fixed; inset: 0; background: rgba(12, 10, 40, .28); z-index: 35; display: none; }
.scrim.on { display: block; }

/* Sections for other views */
.view { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; }
.vhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.vhead h2 { font: 400 34px/1.05 var(--display); }
.vhead h2 i { color: var(--accent); }
.vhead p { color: var(--muted); max-width: 70ch; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.cols2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }
.ocol { display: flex; flex-direction: column; gap: 10px; }
.ohead { display: flex; align-items: center; gap: 10px; }
.ohead .av { width: 34px; height: 34px; font-size: 15px; }
.ohead b { font: 400 26px/1 var(--display); }
.stbar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--surface-3); }
.pgroup { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--ui); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.tbl-wrap { overflow-x: auto; }
table.kpi { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.kpi th, table.kpi td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.kpi th:first-child, table.kpi td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.kpi thead th { color: var(--muted); font-weight: 700; font-size: 11.5px; }
.heat { display: grid; grid-template-columns: 26px repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(64px, auto)) 26px; gap: 4px; }
.hc { border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.hax { font-size: 11px; color: var(--muted); display: grid; place-items: center; font-weight: 700; }
.rbub { border: 0; border-radius: 999px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.rrow:hover { background: var(--surface-2); }
.score { font: 400 26px/1 var(--display); text-align: center; }
.prog { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 5px; }
.prog i { display: block; height: 100%; background: var(--good); }
.moat { display: grid; grid-template-columns: minmax(180px, 1.1fr) repeat(5, minmax(110px, 1fr)); border-top: 1px solid var(--line); }
.moat > div { padding: 12px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.moat .mname b { font: 400 22px/1.1 var(--display); display: block; }
.mstr { height: 6px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.mstr i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.mdots { display: flex; flex-wrap: wrap; gap: 3px; }
.mdots button { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--accent); background: transparent; padding: 0; }
.mdots button.done { background: var(--accent); }
.mdots button.in_progress { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.mval { font-size: 12px; color: var(--muted); }
.mval b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.dec h4 { margin: 0; font-size: 15px; }
.votes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vbtn { border: 1px solid var(--line-2); background: var(--surface); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.vbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

<script>
// Cheeku financial model engine, v2 (October 2026). Monthly, Jan 2027 (t=0) to Dec 2031 (t=59).
// All money in rupees internally. Year index y = 0..4 (2027..2031).
//
// New in v2:
//   - Free users get 20 chats a DAY (the app's real limit). Chat cost follows free, cap-hitting and
//     paying users separately; hitting the cap sells Daily Passes and upgrades.
//   - Corporate and employee benefits (B2B2C): direct sales to companies (Family plan at 30% off for
//     employees), HR benefits platforms, and corporate gifting. Starts once consumer users pass
//     1 lakh, with a set-up lag. Its members are active users too.
//   - Fitness classes in 200 cities: a markup on every session booked.
//   - Three founders.
const N = 60, YEARS = [2027, 2028, 2029, 2030, 2031];
const CR = 1e7, LAKH = 1e5;

const FUNCS = [
  // key, label, CTC lakh/yr (2027), start headcount Jan 2027, office share
  ['founders', 'Founders', 30, 3, 1],
  ['eng', 'Engineering', 30, 2, 1],
  ['ai', 'AI and data', 42, 1, 1],
  ['product', 'Product and design', 26, 0, 1],
  ['clinical', 'Clinical', 18, 1, 0.5],
  ['care', 'Care and support', 5.5, 0, 0],
  ['growth', 'Growth and content', 18, 0, 0.6],
  ['b2b', 'Insurer and state deals', 38, 0, 1],
  ['corp', 'Corporate sales and benefits', 24, 0, 0.8],
  ['hardware', 'Hardware', 40, 0, 1],
  ['ga', 'Finance, legal, people', 22, 0, 1],
];

// Corporate gifting by calendar month: Diwali carries the year.
const GIFT_SEASON = [0.03, 0.03, 0.08, 0.03, 0.03, 0.03, 0.03, 0.06, 0.08, 0.30, 0.20, 0.10];

// Base-case drivers. Arrays are by year 2027..2031 unless marked "by corporate year" (year 1..5
// of the corporate vertical, counted from the month it goes live).
const BASE = {
  mau0: 30000,                                     // monthly active users in launch month
  churn: [0.12, 0.10, 0.085, 0.075, 0.07],         // share of last month's MAU lost
  organic: [0.14, 0.13, 0.115, 0.10, 0.09],         // new organic actives as share of last month's MAU
  mktBudget: [40, 120, 350, 750, 1200],            // marketing, ₹ lakh a month
  cac: [120, 140, 160, 180, 200],                  // ₹ per new paid-acquired active user
  paidConv: [0.009, 0.0145, 0.0205, 0.0245, 0.0265], // paying share of MAU from the app itself
  famShare: 0.5,
  priceFamily: 249, priceSolo: 99, pricePass: 29,
  priceIndex: [1, 1, 1.1, 1.2, 1.3],
  webShare: [0, 0.2, 0.35, 0.45, 0.5],             // subscriptions paid on web/UPI, not app stores
  storeFee: 0.15, webFee: 0.02, gst: 0.18,
  subChurn: 0.06,                                   // monthly paid-subscriber churn, for LTV
  // Chats. Free users get 20 a day; most never come close.
  freeCap: 20,                                      // chats a day on the free plan
  freeChats: [12, 14, 16, 17, 18],                  // chats a month, average free user below the cap
  capHit: [0.02, 0.025, 0.03, 0.03, 0.03],          // share of free users who hit the cap in a month
  capDays: 3,                                       // days a month a cap-hitter spends at the cap
  capPass: 0.15,                                    // share of cap-hitters who buy a Daily Pass that month
  passesPerBuyer: 1.3,
  capUpgrade: 0.12,                                 // cap-hitters who end up on a plan (adds to the paying share)
  paidChats: [40, 45, 50, 52, 55],                  // chats a month per paying account
  // Marketplace (labs, doctors, pharmacy through partners)
  bookRate: [0.03, 0.045, 0.06, 0.07, 0.075],       // share of MAU booking care each month
  aov: [850, 900, 950, 1000, 1050],                 // ₹ per booking
  take: [0.10, 0.11, 0.12, 0.125, 0.13],            // our share of booking value
  mktPartnerCost: 0.20,
  // Fitness classes, 200 cities through the fitness partner
  fitRate: [0.005, 0.008, 0.011, 0.013, 0.015],     // share of MAU booking a class each month
  fitSessions: [2, 2.5, 2.8, 3, 3],                 // sessions per booker a month
  fitBase: [180, 190, 200, 210, 220],               // partner's price per session, ₹
  fitMarkupPct: 0.15, fitMarkupMin: 25, fitRound: 5, // 15%, at least ₹25, rounding adds about ₹5
  fitPayCost: 0.02,                                 // payment cost, share of session value
  // Ads and insurance listings
  adsArpu: [0, 0.6, 1.4, 2.4, 3.6],                 // ₹ ad revenue per MAU per month
  adsCost: 0.15,
  policies: [0, 0.3, 0.5, 0.6, 0.7],                // insurance policies sold per 1,000 MAU per month
  commission: [0, 3000, 3200, 3400, 3600],          // ₹ per policy
  insCost: 0.10,
  // Institutions
  insurers: [0, 0, 1, 4, 7], insurerAcv: [0, 0, 2, 8, 15],   // year-end clients, ₹ cr a year each
  states: [0, 0, 1, 2, 4], stateAcv: [0, 0, 3, 10, 15],
  llmClients: [0, 0, 0, 15, 40], llmAcv: [0, 0, 0, 1, 1.8],
  b2bDelay: 0,                                      // months the insurer/state/LLM schedule slips
  b2bCost: 0.20, llmCost: 0.30,
  arDays: { insurer: 60, state: 120, llm: 45, corp: 30, platform: 45 },
  // Corporate and employee benefits (B2B2C)
  corpTrigger: 100000,                              // consumer MAU that switches the vertical on
  corpLag: 2,                                       // months from reaching it to the first sale
  corpDiscount: 0.30,                               // off the Family plan for employees
  corpClients: [3, 8, 15, 25, 35],                  // new companies signed a month, by corporate year
  corpEmployees: [600, 800, 1000, 1200, 1400],      // employees per new company, by corporate year
  corpClientChurn: 0.15,                            // companies lost a year
  corpEnrolVol: [0.06, 0.08, 0.10, 0.11, 0.12],     // employees who buy it themselves, by corporate year
  corpEmployerPaid: [0.25, 0.30, 0.35, 0.40, 0.40], // share of companies that pay for every employee
  corpEnrolPaid: 0.60,                              // employees who activate when the employer pays
  hrPartners: [2, 4, 6, 8, 10],                     // HR benefits platforms live at the end of each corporate year
  hrLives: [50000, 80000, 100000, 120000, 150000],  // employees each platform reaches
  hrAttach: [0.02, 0.03, 0.04, 0.05, 0.05],         // share of those who pick Cheeku
  hrFee: 0.25,                                      // the platform's share
  giftUnits: [3000, 12000, 30000, 60000, 90000],    // year-long Family plans gifted, by corporate year
  giftDiscount: 0.30,
  giftActivation: 0.70,                             // gifts that are switched on
  usersPerSeat: 1.3,                                // active users per corporate seat (the family uses it)
  corpCacClient: 40000,                             // ₹ to win a company: demos, wellness talks, onboarding
  corpCommission: 0.05,                             // sales commission, share of corporate revenue
  corpServe: 0.05,                                  // account management and onboarding, share of corporate revenue
  giftCost: 0.03,                                   // gift card fulfilment
  // Pendant
  pendantUnits: [0, 0, 1000, 2500, 6000], pendantStart: 33, pendantPrice: 4999, pendantCogs: 0.8,
  // Serving
  cpcRented: 0.30, cpcOwn: [0.10, 0.10, 0.085, 0.07, 0.06], ownGpuMonth: 6,
  voiceStart: 8, voiceMin: [3, 3, 3.5, 4, 4.5], voiceCost: [1.52, 1.0, 0.6, 0.45, 0.35],
  cloud: [1.2, 1.0, 0.8, 0.7, 0.6], cloudFixed: 1.5 * LAKH,
  gpuMult: 1,
  headcount: {   // year-end plan; corp is by corporate year and starts at zero
    founders: [3, 3, 3, 3, 3], eng: [6, 12, 24, 40, 55], ai: [5, 11, 22, 35, 45], product: [2, 4, 8, 12, 16],
    clinical: [3, 6, 12, 18, 24], care: [2, 8, 20, 45, 75], growth: [3, 7, 14, 24, 34], b2b: [1, 2, 6, 14, 22],
    corp: [4, 8, 14, 20, 26], hardware: [0, 2, 4, 8, 10], ga: [1, 3, 8, 14, 20],
  },
  salaryGrowth: 0.10, loading: 0.20, hiringMult: 1,
  seatCost: 12000, seatShare: 0.6,
  llmSpend: [1.0, 2.0, 12, 10, 8],                 // ₹ cr a year, compute and data
  pendantRnd: [0.5, 2.5, 4, 5, 4],                 // ₹ cr a year
  gaFixed: [8, 15, 30, 55, 80],                    // ₹ lakh a month: legal, audit, tools, insurance
  gaPct: 0.01,
  mktMult: 1, cacMult: 1, convMult: 1, bookMult: 1, churnMult: 1, organicMult: 1, corpMult: 1, chatMult: 1,
  interest: 0.06, tax: 0.2517,
  openingCash: 0,
  rounds: [
    { name: 'Seed', month: 0, amount: 26, pre: 104 },
    { name: 'Series A', month: 13, amount: 70, pre: 250 },
    { name: 'Series B', month: 28, amount: 150, pre: 750 },
  ],
  esopPre: 0.10, esopTopUpA: 0.05,
  defend: true, defendRunway: 6,                   // cut spend when runway falls under this many months
  defendMkt: 0.35, defendLlm: 0.5, defendPendant: 0.2,
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }
const scale = (arr, k) => arr.map(v => v * k);

function scenario(name) {
  const s = clone(BASE);
  if (name === 'bear') {
    s.mau0 = 15000;
    s.churn = scale(s.churn, 1.2); s.organic = scale(s.organic, 0.85);
    s.cac = scale(s.cac, 1.4); s.paidConv = scale(s.paidConv, 0.7);
    s.bookRate = scale(s.bookRate, 0.75); s.take = scale(s.take, 0.9);
    s.fitRate = scale(s.fitRate, 0.7);
    s.adsArpu = scale(s.adsArpu, 0.6); s.policies = scale(s.policies, 0.6);
    s.insurers = [0, 0, 0, 2, 4]; s.states = [0, 0, 0, 1, 2]; s.llmClients = [0, 0, 0, 6, 18];
    s.b2bDelay = 6; s.voiceMin = scale(s.voiceMin, 1.3);
    s.freeChats = scale(s.freeChats, 1.15); s.paidChats = scale(s.paidChats, 1.15); s.capHit = scale(s.capHit, 1.3); s.capUpgrade = 0.08;
    s.corpLag = 5; s.corpClients = scale(s.corpClients, 0.6); s.corpEnrolVol = scale(s.corpEnrolVol, 0.7);
    s.corpEmployerPaid = scale(s.corpEmployerPaid, 0.7); s.hrPartners = scale(s.hrPartners, 0.6); s.hrAttach = scale(s.hrAttach, 0.7);
    s.giftUnits = scale(s.giftUnits, 0.6); s.corpClientChurn = 0.22;
    s.pendantUnits = scale(s.pendantUnits, 0.5); s.webShare = scale(s.webShare, 0.6);
    s.rounds[0].pre = 90; s.rounds[1].pre = 160; s.rounds[2].pre = 420;
  }
  if (name === 'bull') {
    s.mau0 = 30000;
    s.churn = scale(s.churn, 0.92); s.organic = scale(s.organic, 1.05);
    s.cac = scale(s.cac, 0.8); s.paidConv = scale(s.paidConv, 1.25);
    s.bookRate = scale(s.bookRate, 1.2); s.take = scale(s.take, 1.05);
    s.fitRate = scale(s.fitRate, 1.25);
    s.adsArpu = scale(s.adsArpu, 1.3); s.policies = scale(s.policies, 1.3);
    s.insurers = [0, 0, 2, 6, 10]; s.states = [0, 0, 1, 3, 6]; s.llmClients = [0, 0, 0, 25, 60];
    s.capUpgrade = 0.15;
    s.corpLag = 1; s.corpClients = scale(s.corpClients, 1.3); s.corpEnrolVol = scale(s.corpEnrolVol, 1.2);
    s.hrPartners = scale(s.hrPartners, 1.3); s.hrAttach = scale(s.hrAttach, 1.2); s.giftUnits = scale(s.giftUnits, 1.3);
    s.corpClientChurn = 0.12;
    s.pendantUnits = scale(s.pendantUnits, 1.5);
    s.rounds[0].pre = 127; s.rounds[1].pre = 350; s.rounds[2].pre = 1200;
  }
  return s;
}

// Value of a year-end stock schedule at month t, ramping linearly through each year.
function ramp(arr, t, start) {
  if (t < 0) return start ?? 0;
  const y = Math.min(4, Math.floor(t / 12)), m = t % 12;
  const prev = y === 0 ? (start ?? 0) : arr[y - 1];
  return prev + (arr[y] - prev) * (m + 1) / 12;
}

function run(s) {
  const Y = t => Math.min(4, Math.floor(t / 12));
  const out = [];
  let mau = 0, cash = s.openingCash * CR, nol = 0, ar = 0, deferred = 0, defending = false, frozen = null;
  let reached = false, sinceReached = 0, corpClients = 0, corpEmployees = 0;
  const giftBill = [], giftUnitsSold = [];
  const burns = [];
  const fund = new Array(N).fill(0);
  for (const r of s.rounds) if (r.month >= 0 && r.month < N) fund[r.month] += r.amount * CR;
  const mChurnCorp = 1 - Math.pow(1 - s.corpClientChurn, 1 / 12);
  for (let t = 0; t < N; t++) {
    const y = Y(t), m = {};
    // Runway defence: when months of cash left fall under the threshold, cut discretionary spend
    // and freeze hiring until the next round lands.
    if (s.defend) {
      const burn = burns.length ? Math.max(0, -burns.slice(-3).reduce((a, b) => a + b, 0) / Math.min(3, burns.length)) : 0;
      if (fund[t] > 0) { defending = false; frozen = null; }
      else if (!defending && burn > 0 && t > 0 && cash / burn < s.defendRunway) defending = true;
    }
    m.defending = defending;
    // Consumer users
    const churn = Math.min(0.5, s.churn[y] * s.churnMult);
    const mktSpend = s.mktBudget[y] * LAKH * s.mktMult * (defending ? s.defendMkt : 1);
    const paidNew = mktSpend / (s.cac[y] * s.cacMult);
    const orgNew = t === 0 ? 0 : mau * s.organic[y] * s.organicMult;
    mau = t === 0 ? s.mau0 + paidNew : mau * (1 - churn) + orgNew + paidNew;
    m.t = t; m.y = y; m.mauConsumer = mau; m.newPaid = paidNew; m.newOrganic = orgNew;
    // Paying accounts and the free tier. Hitting 20 chats a day sells Daily Passes and upgrades.
    const capHit = Math.min(1, s.capHit[y] * s.chatMult);
    const subs = mau * (s.paidConv[y] + capHit * s.capUpgrade) * s.convMult;
    const free = Math.max(0, mau - subs);
    m.subs = subs; m.free = free; m.capHitters = free * capHit;
    m.passes = m.capHitters * s.capPass * s.passesPerBuyer;
    const pi = s.priceIndex[y];
    const gross = (subs * s.famShare * s.priceFamily + subs * (1 - s.famShare) * s.priceSolo) * pi + m.passes * s.pricePass;
    m.rSub = gross / (1 + s.gst);
    const feeRate = (1 - s.webShare[y]) * s.storeFee + s.webShare[y] * s.webFee;
    m.cStore = m.rSub * feeRate;
    // Corporate and employee benefits. Switches on a set number of months after consumer MAU
    // first passes the trigger; its schedules run by corporate year (k = months since live).
    if (!reached && mau >= s.corpTrigger) reached = true;
    sinceReached = reached ? sinceReached + 1 : 0;
    const live = sinceReached > s.corpLag;
    const k = live ? sinceReached - s.corpLag - 1 : -1, ky = Math.min(4, Math.max(0, Math.floor(k / 12)));
    m.corpLive = live ? 1 : 0; m.corpAge = k;
    const seatPrice = s.priceFamily * pi * (1 - s.corpDiscount);            // incl. GST, a month
    const newClients = live ? s.corpClients[ky] * s.corpMult : 0;
    corpClients = corpClients * (1 - mChurnCorp) + newClients;
    corpEmployees = corpEmployees * (1 - mChurnCorp) + newClients * s.corpEmployees[ky];
    const ep = s.corpEmployerPaid[ky];
    const enrol = live ? (1 - ep) * s.corpEnrolVol[ky] + ep * s.corpEnrolPaid : 0;
    m.corpClients = corpClients; m.corpNewClients = newClients; m.corpEmployees = corpEmployees;
    m.seatsDirect = corpEmployees * enrol;
    m.rCorpDirect = m.seatsDirect * seatPrice / (1 + s.gst);
    m.hrPartners = live ? ramp(s.hrPartners, k, 0) * s.corpMult : 0;
    m.seatsHr = m.hrPartners * s.hrLives[ky] * s.hrAttach[ky];
    m.rCorpHr = m.seatsHr * seatPrice / (1 + s.gst);
    // Gifting: a year-long plan sold in a lump (cash now), earned over twelve months.
    const units = live ? s.giftUnits[ky] * GIFT_SEASON[t % 12] * s.corpMult : 0;
    giftUnitsSold.push(units);
    const bill = units * s.priceFamily * pi * 12 * (1 - s.giftDiscount) / (1 + s.gst);
    giftBill.push(bill);
    const last12 = giftBill.slice(Math.max(0, t - 11)), last12u = giftUnitsSold.slice(Math.max(0, t - 11));
    m.rCorpGift = last12.reduce((a, b) => a + b, 0) / 12;
    m.giftBilled = bill;
    deferred += bill - m.rCorpGift;
    m.deferred = deferred;
    m.seatsGift = last12u.reduce((a, b) => a + b, 0) * s.giftActivation;
    m.seats = m.seatsDirect + m.seatsHr + m.seatsGift;
    m.mauCorp = m.seats * s.usersPerSeat;
    m.rCorp = m.rCorpDirect + m.rCorpHr + m.rCorpGift;
    m.cCorp = m.rCorp * s.corpServe + m.rCorpHr * s.hrFee + m.rCorpGift * s.giftCost + (m.rCorpDirect + m.rCorpHr) * s.webFee;
    m.oCorpSales = newClients * s.corpCacClient + m.rCorp * s.corpCommission;
    // Everyone active, consumer and corporate, books care, sees ads and chats.
    const all = mau + m.mauCorp;
    m.mau = all;
    // Marketplace
    const book = Math.min(0.5, s.bookRate[y] * s.bookMult);
    m.gmvCare = all * book * s.aov[y];
    m.rMkt = m.gmvCare * s.take[y];
    m.cMkt = m.rMkt * s.mktPartnerCost;
    // Fitness classes
    const fitBase = s.fitBase[y], markup = Math.max(s.fitMarkupMin, fitBase * s.fitMarkupPct) + s.fitRound;
    m.fitSessions = all * Math.min(0.5, s.fitRate[y] * s.bookMult) * s.fitSessions[y];
    m.gmvFit = m.fitSessions * (fitBase + markup);
    m.rFit = m.fitSessions * markup;
    m.cFit = m.gmvFit * s.fitPayCost;
    m.gmv = m.gmvCare + m.gmvFit;
    // Ads and insurance listings
    m.rAds = all * s.adsArpu[y]; m.cAds = m.rAds * s.adsCost;
    m.rIns = all / 1000 * s.policies[y] * s.commission[y]; m.cIns = m.rIns * s.insCost;
    // Institutions (schedule slips by b2bDelay months)
    const td = t - s.b2bDelay, yd = Math.max(0, Y(Math.max(0, td)));
    m.insurers = ramp(s.insurers, td, 0); m.states = ramp(s.states, td, 0); m.llmClients = ramp(s.llmClients, td, 0);
    m.rInsurer = td < 0 ? 0 : m.insurers * s.insurerAcv[yd] * CR / 12;
    m.rState = td < 0 ? 0 : m.states * s.stateAcv[yd] * CR / 12;
    m.rLlm = td < 0 ? 0 : m.llmClients * s.llmAcv[yd] * CR / 12;
    m.cB2b = (m.rInsurer + m.rState) * s.b2bCost + m.rLlm * s.llmCost;
    // Pendant hardware
    m.rHw = t >= s.pendantStart ? s.pendantUnits[y] * s.pendantPrice / (1 + s.gst) : 0;
    m.cHw = m.rHw * s.pendantCogs;
    m.rev = m.rSub + m.rMkt + m.rFit + m.rAds + m.rIns + m.rCorp + m.rInsurer + m.rState + m.rLlm + m.rHw;
    // Serving costs: free users below the cap, days at the cap, paying accounts and corporate seats.
    const cpc = t < s.ownGpuMonth ? s.cpcRented : s.cpcOwn[y];
    m.chatsFree = free * s.freeChats[y] * s.chatMult;
    m.chatsCap = m.capHitters * s.freeCap * s.capDays;

// Charts are drawn at the width they will show at, so text stays at its set size.
function chartW(half) { const m = $('main'); const full = Math.max(300, (m ? m.clientWidth : 1200) - 2 * Math.max(16, 0) - 34); return Math.round(half && full > 900 ? (full - 16) / 2 - 34 : full); }

}
function eventMarks(F, x) {

}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function chartUsers() {
  const M = S.model, F = svgFrame(chartW(false), 300);
  const x = t => F.pad.l + (t / 60) * (F.w - F.pad.l - F.pad.r);
  const total = M.rows.map(r => r.mau), ymax = niceMax(Math.max(...total));
  const y = v => F.h - F.pad.b - (v / ymax) * (F.h - F.pad.t - F.pad.b);
  const years = [2027, 2028, 2029, 2030, 2031], shades = ['var(--accent)', 'color-mix(in srgb, var(--accent) 72%, var(--surface))', 'color-mix(in srgb, var(--accent) 50%, var(--surface))', 'color-mix(in srgb, var(--accent) 32%, var(--surface))', 'color-mix(in srgb, var(--accent) 18%, var(--surface))'];
  const byYear = years.map(yr => new Array(60).fill(0).map((_, t) => M.cohortKeys.filter(k => PERIODS[PIDX[k]].year === yr).reduce((a, k) => a + M.layers[k][t], 0)));

  const band = (vals, fill) => { const top = vals.map((v, t) => base[t] + v); const d = 'M' + top.map((v, t) => `${x(t).toFixed(1)} ${y(v).toFixed(1)}`).join(' L') + ' L' + base.map((v, t) => `${x(59 - t).toFixed(1)} ${y(base[59 - t]).toFixed(1)}`).join(' L') + 'Z'; base = top; return `<path d="${d}" fill="${fill}"/>`; };

function chartRevenue() {
  const M = S.model, F = svgFrame(chartW(true), 300), P = M.per.filter(p => !p.empty);
  const groups = [['Subscriptions', r => r.rSub, 'var(--accent)'], ['Care and fitness', r => r.rMkt + r.rFit, 'color-mix(in srgb, var(--accent) 55%, var(--surface))'], ['Ads and listings', r => r.rAds + r.rIns, 'color-mix(in srgb, var(--accent) 28%, var(--surface))'], ['Employers', r => r.rCorp, 'var(--lime)'], ['Institutions and pendant', r => r.rInsurer + r.rState + r.rLlm + r.rHw, 'var(--navy)']];
  // Monthly average in each period, so quarters and halves compare fairly.
  const vals = P.map(p => { const R = M.rows.slice(p.start, Math.min(60, p.end)); return groups.map(g => R.reduce((a, r) => a + g[1](r), 0) / R.length / 1e7); });
  const eb = P.map(p => { const R = M.rows.slice(p.start, Math.min(60, p.end)); return R.reduce((a, r) => a + r.ebitda, 0) / R.length / 1e7; });

  const bw = (F.w - F.pad.l - F.pad.r) / P.length;

  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; grid += `<line x1="${F.pad.l}" x2="${F.w - F.pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${F.pad.l - 6}" y="${y(v) + 4}" text-anchor="end">₹${fmtCr(v)}</text>`; }
  const every = bw < 34 ? 4 : bw < 60 ? 2 : 1;
  P.forEach((p, i) => { let acc = 0; const x0 = F.pad.l + i * bw + bw * .18; vals[i].forEach((v, j) => { s += `<rect x="${x0}" y="${y(acc + v)}" width="${bw * .64}" height="${Math.max(0, y(acc) - y(acc + v))}" fill="${groups[j][2]}"><title>${p.label} ${groups[j][0]}: ₹${v.toFixed(2)} cr a month</title></rect>`; acc += v; }); if (i % every === 0) s += `<text x="${x0 + bw * .32}" y="${F.h - 8}" text-anchor="middle">${p.label}</text>`; });
  const line = eb.map((v, i) => `${(F.pad.l + i * bw + bw / 2).toFixed(1)} ${y(v).toFixed(1)}`).join(' L');

  const legend = groups.map(g => `<span><i class="dot" style="background:${g[2]};border-radius:2px"></i>${g[0]}</span>`).join('') + `<span><i class="dot" style="background:var(--bad)"></i>EBITDA</span>`;
  return `<div class="panel chart"><h3>Revenue a month, ₹ cr, by engine (average in each period)</h3><svg viewBox="0 0 ${F.w} ${F.h}" role="img" aria-label="Average monthly revenue by engine for each period, with EBITDA">${grid}<line x1="${F.pad.l}" x2="${F.w - F.pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--faint)"/>${s}</svg><div class="legend">${legend}</div></div>`;
}
function chartCash() {

// ----------------------------------------------------------------- risks --
function riskScore(r) { return (Number(r.likelihood) || 1) * (Number(r.impact) || 1); }
function riskProgress(r) { const ids = (r.items || []).filter(id => S.items.has(id)); if (!ids.length) return null; const done = ids.filter(id => S.items.get(id).status === 'done').length; return { done, n: ids.length }; }
function renderRisks() {
  const R = [...S.risks.values()].filter(r => !S.filters.owners.size || S.filters.owners.has(r.owner || 'none'));
  let heat = '';

    heat += `<div class="hax">${l}</div>`;
    for (let i = 1; i <= 5; i++) {
      const sc = l * i, bg = sc >= 15 ? 'color-mix(in srgb, var(--bad) 28%, var(--surface))' : sc >= 8 ? 'color-mix(in srgb, var(--warn) 24%, var(--surface))' : 'color-mix(in srgb, var(--good) 16%, var(--surface))';
      const here = R.filter(r => Number(r.likelihood) === l && Number(r.impact) === i && r.status !== 'closed');
      heat += `<div class="hc" style="background:${bg}">${here.map(r => `<button class="rbub" type="button" data-risk="${esc(r.id)}" title="${esc(r.title)}">${esc(r.short || r.title)}</button>`).join('')}</div>`;
    }
  }
  heat += `<div></div>${[1, 2, 3, 4, 5].map(i => `<div class="hax">${i}</div>`).join('')}`;
  const list = R.sort((a, b) => riskScore(b) - riskScore(a)).map(r => {
    const pr = riskProgress(r);
    return `<div class="rrow" data-risk="${esc(r.id)}" tabindex="0" role="button"><div class="score num" style="color:${riskScore(r) >= 15 ? 'var(--bad)' : riskScore(r) >= 8 ? 'var(--warn)' : 'var(--good)'}">${riskScore(r)}</div>
      <div style="min-width:0"><div style="font-weight:700">${esc(r.title)}</div><div class="meta">${esc(r.mitigation || '')}</div>${pr ? `<div class="prog" title="${pr.done} of ${pr.n} mitigation cards done"><i style="width:${100 * pr.done / pr.n}%"></i></div>` : ''}</div>
      <div style="display:flex;gap:6px;align-items:center">${ownerAv(r.owner)}<span class="chip-ro">${esc(r.status || 'open')}</span></div></div>`;
  }).join('');
  return `<div class="wrap view"><div class="vhead"><h2>What could break us, <i>and the plan for it.</i></h2><p>Likelihood up, impact across. Link mitigation cards to a risk and its bar fills as they get done.</p>${S.canEdit ? '<button class="btn" type="button" id="addRisk">Add risk</button>' : ''}</div>
    <div class="cols2"><div class="panel"><h3>Heat map</h3><div class="heat">${heat}</div><div class="legend"><span>Rows: likelihood 1 to 5</span><span>Columns: impact 1 to 5</span></div></div><div class="panel"><h3>Register, worst first</h3>${list || '<div class="empty">No risks logged yet.</div>'}</div></div></div>`;
}

// ----------------------------------------------------------------- moats --
function moatSeries(key) {
  const M = S.model, rows = M.rows;
  if (key === 'memory') { let c = 0; return rows.map(r => (c += r.chats)); }
  if (key === 'model') return rows.map(r => r.chats ? r.cChat / r.chats : 0);
  if (key === 'supply') return rows.map(r => r.gmv * 12 / 1e7);
  if (key === 'distribution') return rows.map(r => r.seats);
  if (key === 'habit') return rows.map(r => r.subs);
  return null;
}
function renderMoats() {
  const pillars = [...S.moats.values()].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const years = [2027, 2028, 2029, 2030, 2031];
  const W = { done: 1, in_progress: .5, planned: .25, at_risk: .2, blocked: .1, idea: .05 };
  const head = `<div class="flabel">Pillar</div>${years.map(y => `<div class="flabel">${y}</div>`).join('')}`;
  const rows = pillars.map(p => {
    const its = [...S.items.values()].filter(it => it.moat === p.id && it.status !== 'dropped').map(it => ({ it, pl: placeOf(it) }));
    const total = Math.max(1, its.reduce((a, x) => a + 1, 0));
    const ser = moatSeries(p.metric), mm = MOAT_METRICS[p.metric] || MOAT_METRICS.none;
    let cum = 0;
    const cells = years.map(y => {
      const inYear = its.filter(x => { const pp = PERIODS[PIDX[x.pl.period]]; return pp && (pp.year === y || (y === 2027 && pp.year === 2026)); });
      cum += inYear.reduce((a, x) => a + (W[x.it.status] ?? .05), 0);
      const val = ser ? ser[y * 12 - 2027 * 12 + 11] : null;
      return `<div><div class="mstr" title="Strength built so far"><i style="width:${Math.min(100, 100 * cum / total).toFixed(0)}%"></i></div><div class="mdots">${inYear.map(x => `<button type="button" class="${esc(x.it.status || 'idea')}" data-id="${esc(x.it.id)}" title="${esc(x.it.title)} · ${esc(STATUS_LABEL[x.it.status] || '')}"></button>`).join('')}</div>${val != null ? `<div class="mval" style="margin-top:6px"><b>${mm.fmt(val)}</b></div>` : ''}</div>`;
    }).join('');
    return `<div class="mname"><b>${esc(p.name)}</b><div class="meta">${esc(p.thesis || '')}</div>${mm.label ? `<div class="meta" style="margin-top:4px">Model: ${esc(mm.label)}, Dec of each year</div>` : ''}</div>${cells}`;
  }).join('');
  return `<div class="wrap view"><div class="vhead"><h2>Why we get <i>harder to copy</i> every year.</h2><p>Each pillar of defensibility, the cards that build it (filled = done) and a live number from the model. Give a card a moat pillar in its editor to place it here.</p></div>
    <div class="panel tbl-wrap"><div class="moat">${head}${rows || `<div style="grid-column:1/-1" class="empty">No pillars yet.</div>`}</div></div></div>`;
}

// ------------------------------------------------------------- decisions --
function renderDecisions() {
  const D = [...S.items.values()].filter(it => it.kind === 'decision' && matches(it)).map(it => ({ it, pl: placeOf(it) })).sort((a, b) => PIDX[a.pl.period] - PIDX[b.pl.period]);
  const me = S.me && S.me.id;
  const block = (list, title) => `<div class="panel"><h3>${title} · ${list.length}</h3>${list.map(({ it, pl }) => {
    const v = it.votes || {}, mine = me ? v[me] : null;
    const faces = Object.entries(v).map(([u, c]) => `<span title="${esc(personName(u))}: ${esc(c)}"><img alt="" src="${esc((S.profiles[u] || {}).avatarUrl || '')}"> ${esc(c)}</span>`).join('');
    return `<div class="dec"><div style="min-width:0"><div class="ctop">${glyph('decision', it.lane)}${esc(PERIODS[PIDX[pl.period]].label)} · ${ownerAv(it.owner)} ${esc(OWNERS.find(o => o.id === it.owner)?.name || '')}</div><h4 style="margin-top:4px"><a href="#" data-id="${esc(it.id)}" style="color:inherit;text-decoration:none">${esc(it.title)}</a></h4>${it.options ? `<div class="meta" style="margin-top:4px"><b>Options:</b> ${esc(it.options)}</div>` : ''}${it.outcome ? `<div style="margin-top:6px;font-weight:600;color:var(--good)">Decided: ${esc(it.outcome)}</div>` : ''}</div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${S.canEdit && me && it.status !== 'done' ? `<div class="votes">${['for', 'unsure', 'against'].map(c => `<button type="button" class="vbtn" data-vote="${esc(it.id)}|${c}" aria-pressed="${mine === c}">${c[0].toUpperCase() + c.slice(1)}</button>`).join('')}</div>` : ''}<div class="vfaces">${faces}</div></div></div>`;
  }).join('') || '<div class="empty">None.</div>'}</div>`;
  const open = D.filter(x => x.it.status !== 'done' && x.it.status !== 'dropped'), done = D.filter(x => x.it.status === 'done');

}

// ---------------------------------------------------------------- render --
function render() {
  const tabs = $('tabs').querySelectorAll('a');
  tabs.forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + S.view ? 'page' : 'false'));
  $('ro').hidden = S.canEdit || !S.db; $('btnAdd').hidden = !S.canEdit;
  renderLevers(); renderFilters(); renderMainOnly(); renderPeers();
  if (S.editing && $('drawer').classList.contains('open')) refreshDrawerLands();
}
function renderMainOnly() {
  const scroll = $('boardScroll'); const sx = scroll ? scroll.scrollLeft : null, sy = scroll ? scroll.scrollTop : null;

  const ns = $('boardScroll');
  if (ns) { if (sx != null) { ns.scrollLeft = sx; ns.scrollTop = sy; } else if (!renderMainOnly.did) { renderMainOnly.did = true; } }
  if (v === 'decisions') { const ids = []; for (const it of S.items.values()) Object.keys(it.votes || {}).forEach(u => ids.push(u)); profilesFor(ids).then(ps => { if (Object.keys(ps).some(k => !renderMainOnly.seen?.[k])) { renderMainOnly.seen = { ...ps }; scheduleRender(); } }); }
}

  profilesFor(uniq.map(p => p.by)).then(ps => {
    el.innerHTML = uniq.slice(0, 5).map(p => `<img alt="${esc((ps[p.by] || {}).name || 'Someone')}" title="${esc(((ps[p.by] || {}).name || 'Someone') + (p.isMe ? ' (you)' : '') + (p.presence && p.presence.view ? ' · ' + p.presence.view : ''))}" src="${esc((ps[p.by] || {}).avatarUrl || '')}">`).join('');
  });
}
function renderFeed() {

let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {} });
document.addEventListener('dragover', e => { const cell = e.target.closest && e.target.closest('.cell'); if (!cell || !dragId) return; e.preventDefault(); document.querySelectorAll('.cell.over').forEach(x => x !== cell && x.classList.remove('over')); cell.classList.add('over'); });
document.addEventListener('dragleave', e => { const cell = e.target.closest && e.target.closest('.cell'); if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('over'); });
document.addEventListener('drop', async e => {
  const cell = e.target.closest && e.target.closest('.cell'); document.querySelectorAll('.cell.over').forEach(x => x.classList.remove('over'));
  if (!cell || !dragId) return; e.preventDefault();
  const it = S.items.get(dragId); const id = dragId; dragId = null; if (!it) return;
  if (it.gate && it.gate.type) { toast('The model places this card. Change its trigger in the card to move it.'); return; }
  const lane = cell.dataset.lane, period = cell.dataset.period;
  if (lane === it.lane && period === it.period) return;
  const patch = { lane, period, ...stamp() };
  if (it.endPeriod && PIDX[it.endPeriod] < PIDX[period]) patch.endPeriod = null;
  S.items.set(id, { ...it, ...patch }); renderMainOnly();
  await patchDoc('items/' + id, patch, `moved "${it.title}" to ${PERIODS[PIDX[period]].label}, ${LANES.find(l => l.id === lane).label}`);
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.cell.over').forEach(x => x.classList.remove('over')); });

async function exportBoard() {
  const data = { exportedAt: new Date().toISOString(), plan: S.plan, items: [...S.items.values()], risks: [...S.risks.values()], moats: [...S.moats.values()], tags: [...S.tags.values()] };
  const text = JSON.stringify(data, null, 2);
  if (S.downloads) { try { await S.downloads.save({ filename: 'cheeku-vision-board.json', data: text }); return; } catch (e) { if (e && e.code === 'cancelled') return; } }
  try { await navigator.clipboard.writeText(text); toast('Board copied as JSON'); } catch (e) { toast('Export is not available in this view.'); }
}

// ------------------------------------------------------------------ boot --
recompute(); route();
(async () => {
  const c = window.claude; if (!c || !c.use) { setSync(); return; }
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  S.db = db; S.user = user;
  if (user) { try { S.me = await user.me(); S.canEdit = !!S.me.canEdit; } catch (e) {} }
  setSync();
  if (db) subscribe();
  render();
  c.use('room').then(room => { S.room = room; if (!room) return; presence({}); room.onPeers(ch => { S.peers = ch.peers || []; renderPeers(); if (S.view === 'board') scheduleRender(); }, () => {}); });
  c.use('comments').then(cm => { S.comments = cm; });
  c.use('downloads').then(dl => { S.downloads = dl; });
})();
</script>
