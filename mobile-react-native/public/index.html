<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      The web build's shell, so the Vercel link feels like an app on a phone
      rather than a page (UI audit, October 2026; the mobile-native skill).
      viewport-fit=cover lets env(safe-area-inset-*) work under the notch;
      zoom stays allowed on purpose.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The app is light-only for now; the status bar matches the canvas. -->
    <meta name="theme-color" content="#fafafe" />
    <meta name="color-scheme" content="light" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="native-feel">
      html {
        /* No grey flash on tap: every control has its own press state. */
        -webkit-tap-highlight-color: transparent;
        /* No font inflation in landscape. */
        -webkit-text-size-adjust: 100%;
      }
      html,
      body {
        /* Scroll lives inside the app's own lists; the page itself never
           rubber-bands or pull-to-refreshes. */
        overscroll-behavior: none;
        background: #fafafe;
      }
      /* iOS zooms into any input under 16px and does not zoom back out. */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      /* Controls are not text: no selection or callout on a long press. */
      [role="button"],
      [role="tab"],
      button {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
