<title>Cheeku Raise Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: the vision board's calm surface, turned into a raise room. One translucent toolbar, a raise strip
   (₹26 cr against what is committed), then the funnel as columns; any investor opens into a sheet with the
   conversation timeline and an outreach composer. */
:root {
  --bg: #F5F5F7; --surface: #FFFFFF; --surface-2: #F2F2F5; --surface-3: #E8E8ED;
  --ink: #1D1D1F; --ink-2: #3A3A3F; --muted: #6E6E73; --faint: #A1A1A6;
  --line: rgba(20, 20, 40, .08); --line-2: rgba(20, 20, 40, .14);
  --accent: #5B4EF0; --accent-2: #4536D9; --accent-soft: #EEECFF; --on-accent: #FFFFFF;
  --lime: #E4FF7A; --lime-ink: #2F3D00; --navy: #14136B; --on-navy: #FFFFFF;
  --good: #248A3D; --warn: #B86E00; --bad: #D70015;
  --o-athar: #5B4EF0; --o-deepesh: #C9620F; --o-none: #A1A1A6;
  --k-vc: #2F6FDE; --k-angel: #C8417F; --k-acc: #0A9396; --k-net: #8E6A2E;
  --sh-1: 0 0 0 0.5px rgba(20, 20, 40, .08), 0 1px 2px rgba(20, 20, 40, .05), 0 2px 8px rgba(20, 20, 40, .035);
  --sh-2: 0 0 0 0.5px rgba(20, 20, 40, .1), 0 6px 16px rgba(20, 20, 40, .08), 0 16px 36px rgba(20, 20, 40, .06);
  --sh-sheet: 0 0 0 0.5px rgba(20, 20, 40, .12), 0 30px 90px rgba(20, 20, 40, .28);
  --glass: rgba(255, 255, 255, .72); --scrim: rgba(20, 20, 30, .28);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
  --brand: 'Instrument Serif', Georgia, serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --colw: 272px; --barh: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0B0E; --surface: #1C1C1F; --surface-2: #242428; --surface-3: #2F2F35;
  --ink: #F5F5F7; --ink-2: #D6D6DC; --muted: #98989F; --faint: #63636B; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --accent: #8F87FF; --accent-2: #B3ADFF; --accent-soft: #24213F; --on-accent: #0B0B0E;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2C2A85; --on-navy: #FFFFFF;
  --good: #32D06A; --warn: #FFB340; --bad: #FF6B6B;
  --o-athar: #8F87FF; --o-deepesh: #F0913C; --o-none: #63636B;
  --k-vc: #74A3FF; --k-angel: #F07AB5; --k-acc: #3CCACC; --k-net: #D2A262;
  --sh-1: 0 0 0 0.5px rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-2: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .5);
  --sh-sheet: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 30px 90px rgba(0, 0, 0, .65);
  --glass: rgba(28, 28, 31, .72); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B0B0E; --surface: #1C1C1F; --surface-2: #242428; --surface-3: #2F2F35;
  --ink: #F5F5F7; --ink-2: #D6D6DC; --muted: #98989F; --faint: #63636B; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --accent: #8F87FF; --accent-2: #B3ADFF; --accent-soft: #24213F; --on-accent: #0B0B0E;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2C2A85; --on-navy: #FFFFFF;
  --good: #32D06A; --warn: #FFB340; --bad: #FF6B6B;
  --o-athar: #8F87FF; --o-deepesh: #F0913C; --o-none: #63636B;
  --k-vc: #74A3FF; --k-angel: #F07AB5; --k-acc: #3CCACC; --k-net: #D2A262;
  --sh-1: 0 0 0 0.5px rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-2: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .5);
  --sh-sheet: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 30px 90px rgba(0, 0, 0, .65);
  --glass: rgba(28, 28, 31, .72); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Toolbar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid var(--line-2); }
.bar-in { min-height: var(--barh); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font: italic 400 26px/1 var(--brand); color: var(--accent); letter-spacing: -0.01em; }
.brand span { font: 600 12px/1 var(--font); color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 2px; gap: 2px; }
nav.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg > a, .seg > button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg > [aria-current="page"], .seg > [aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 0.5px var(--line-2), 0 1px 3px rgba(0, 0, 0, .1); font-weight: 600; text-decoration: none; }
.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface-3); border-radius: 9px; padding: 0 10px; height: 32px; min-width: 0; }
.search input { border: 0; background: transparent; outline: 0; width: 180px; max-width: 40vw; font-size: 13px; }
.btn { border: 0; height: 32px; padding: 0 12px; border-radius: 9px; background: var(--surface-3); color: var(--ink); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--line-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.lime { background: var(--lime); color: var(--lime-ink); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.btn[disabled] { opacity: .5; cursor: default; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.sync.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.sync.err { background: var(--bad); }
.peers { display: flex; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px/1 var(--font); color: #fff; background: var(--o-none); box-shadow: 0 0 0 2px var(--surface); flex: none; }
.av.athar { background: var(--o-athar); } .av.deepesh { background: var(--o-deepesh); }
.av.sm { width: 20px; height: 20px; font-size: 10px; }
.peers .av + .av { margin-left: -6px; }

/* Filter row */
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-block: 0 10px; font-size: 12px; color: var(--muted); }
.fgroup { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.chip { border: 0; padding: 4px 10px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Raise strip */
.strip { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 16px 28px; padding-block: 16px; align-items: center; }
@media (max-width: 860px) { .strip { grid-template-columns: minmax(0, 1fr); } }
.raise h1 { font: italic 400 34px/1.05 var(--brand); letter-spacing: -0.01em; }
.raise h1 span { color: var(--accent); }
.raise p { margin: 4px 0 10px; color: var(--muted); font-size: 13px; }
.meter { height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; transition: width .5s var(--ease-out); }
.meter .c { background: var(--accent); } .meter .s { background: color-mix(in srgb, var(--accent) 35%, var(--surface-3)); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend b { color: var(--ink); font-weight: 600; }
.funnel { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 860px) { .funnel { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fstep { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--sh-1); border: 0; text-align: left; display: grid; gap: 2px; min-width: 0; }
.fstep b { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.fstep span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fstep .bar-s { height: 3px; border-radius: 2px; background: var(--accent); opacity: .8; }

/* Pipeline */
.board { overflow-x: auto; padding-bottom: 24px; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: var(--colw); gap: 12px; align-items: start; width: max-content; padding-right: 20px; }
.col { background: var(--surface-2); border-radius: 14px; padding: 8px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.col.over { box-shadow: inset 0 0 0 2px var(--accent); }
.col-h { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 6px 2px; gap: 8px; }
.col-h h3 { font-size: 13px; font-weight: 650; }
.col-h span { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--sh-1); border: 0; text-align: left; display: grid; gap: 6px; width: 100%; cursor: grab; transition: box-shadow .2s var(--ease-out), transform .2s var(--ease-out); position: relative; }
.card:hover { box-shadow: var(--sh-2); }
.card.dragging { opacity: .5; }
.card-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-t b { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.card-m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.k-VC { background: color-mix(in srgb, var(--k-vc) 14%, transparent); color: var(--k-vc); }
.pill.k-Angel { background: color-mix(in srgb, var(--k-angel) 14%, transparent); color: var(--k-angel); }
.pill.k-Accelerator { background: color-mix(in srgb, var(--k-acc) 14%, transparent); color: var(--k-acc); }
.pill.k-Angel-network, .pill.k-Platform { background: color-mix(in srgb, var(--k-net) 16%, transparent); color: var(--k-net); }
.tier { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; background: var(--surface-3); color: var(--ink-2); }
.tier.A { background: var(--lime); color: var(--lime-ink); } .tier.B { background: var(--accent-soft); color: var(--accent); }
.due { color: var(--warn); font-weight: 600; } .due.late { color: var(--bad); }
.flag { color: var(--warn); }
.watch { position: absolute; top: -6px; right: -6px; }
.more { border: 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 600; padding: 6px; }
.empty-col { font-size: 12px; color: var(--faint); padding: 10px 6px; }

/* List */
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); margin-bottom: 24px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 0.5px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--surface-2); }
td.wrapc { white-space: normal; min-width: 260px; color: var(--muted); font-size: 12px; }

/* Today */
.today { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding-bottom: 24px; }
.panel { background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel h3 { font-size: 14px; } .panel > p { margin: 0; font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 0; background: transparent; text-align: left; width: 100%; }
.row:hover { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; } .row .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .grow span { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Context */
.ctx { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; padding-bottom: 24px; }
@media (max-width: 860px) { .ctx { grid-template-columns: minmax(0, 1fr); } }
textarea, .inp, select.inp { width: 100%; border: 0; border-radius: 10px; background: var(--surface-2); padding: 9px 11px; font-size: 13px; outline: 0; box-shadow: inset 0 0 0 1px var(--line); }
textarea:focus, .inp:focus { box-shadow: inset 0 0 0 2px var(--accent); }
textarea { resize: vertical; line-height: 1.5; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; animation: fade .2s var(--ease-out); }
.sheet { position: fixed; z-index: 51; top: max(16px, env(safe-area-inset-top, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(980px, calc(100vw - 32px)); background: var(--surface); border-radius: 18px; box-shadow: var(--sh-sheet); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; animation: slide .35s var(--ease-sheet); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { animation: none; } .card, .meter i { transition: none; } }
.sh-h { padding: 16px 20px 12px; border-bottom: 0.5px solid var(--line); display: grid; gap: 8px; }
.sh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 6px; }
.sh-h, .sh-b { min-width: 0; }
@media (max-width: 600px) { .sh-top h2 { flex: 1 1 calc(100% - 80px); } .sh-top .save-st { flex: 1; font-size: 12px; } }
.sh-top h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: var(--surface-3); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; line-height: 1; }
.track { display: flex; gap: 3px; flex-wrap: wrap; }
.track button { border: 0; padding: 4px 9px; border-radius: 7px; background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 500; }
.track button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.track button.done { color: var(--ink-2); background: var(--accent-soft); }
.track .closed[aria-pressed="true"] { background: var(--ink-2); color: var(--surface); }
.sh-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); min-height: 0; }
@media (max-width: 860px) { .sh-b { grid-template-columns: minmax(0, 1fr); overflow-y: auto; } .sh-b > * { overflow: visible !important; } }
.sh-l, .sh-r { overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 14px; align-content: start; }
.sh-r { background: var(--surface-2); }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: block; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fit { display: flex; gap: 12px; align-items: center; }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-3) 0); display: grid; place-items: center; flex: none; }
.ring b { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.why { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; }
.flags { display: grid; gap: 4px; font-size: 12.5px; color: var(--warn); }
.contact { display: grid; gap: 6px; font-size: 13px; }
.contact div { display: flex; gap: 8px; align-items: center; min-width: 0; }
.contact span.v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
.copy { border: 0; background: var(--surface-3); border-radius: 6px; font-size: 11px; padding: 2px 7px; font-weight: 600; color: var(--ink-2); }
.owner { display: inline-flex; gap: 4px; }
.owner button { border: 0; border-radius: 999px; padding: 4px 10px 4px 4px; background: var(--surface-2); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
.owner button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.rs { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 10px; font-size: 13px; }
.rs ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; color: var(--ink-2); }
.rs .src { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; }
.rs-st { font-size: 12px; color: var(--muted); }
.rs-st.q { color: var(--warn); font-weight: 600; }
.save-st { font-weight: 600; color: var(--muted); }
.save-st.ok { color: var(--good); } .save-st.ok::before { content: "✓ "; }
.save-st.err { color: var(--bad); }
.grants { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; padding-bottom: 24px; }
.gcard { background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; font-size: 13px; }
.gcard h3 { font-size: 15px; font-weight: 650; }
.gcard .amt { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.gcard ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; color: var(--ink-2); }
.gcard.muted-card { opacity: .72; }
.fitp { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.fitp.now { background: var(--lime); color: var(--lime-ink); } .fitp.inc { background: var(--accent-soft); color: var(--accent); }
.fitp.seed { background: color-mix(in srgb, var(--k-acc) 16%, transparent); color: var(--k-acc); } .fitp.long { background: var(--surface-3); color: var(--ink-2); }
.fitp.no { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.gst { font-size: 11.5px; font-weight: 600; } .gst.open { color: var(--good); } .gst.soon { color: var(--warn); } .gst.closed { color: var(--bad); }
.memo { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 13px; display: grid; gap: 6px; }
.memo b { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Composer */
.compose { background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); padding: 12px; display: grid; gap: 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.acts .btn { height: 30px; }
.draft { min-height: 210px; font-size: 13.5px; }
.gen-status { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; min-height: 18px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .2; } }
.tl { display: grid; gap: 8px; }
.ev { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--sh-1); display: grid; gap: 4px; font-size: 13px; }
.ev-h { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.ev-h b { color: var(--ink); font-weight: 600; }
.ev p { margin: 0; white-space: pre-wrap; color: var(--ink-2); max-height: 7.5em; overflow: hidden; }
.ev.open p { max-height: none; }
.ev.stage { background: transparent; box-shadow: none; padding: 2px 4px; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 80; box-shadow: var(--sh-2); }
.emptyst { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.emptyst b { font: italic 400 26px/1.1 var(--brand); color: var(--ink); }
</style>

<header class="bar">
  <div class="wrap bar-in">
    <div class="brand"><b>Cheeku</b><span>Raise tracker</span></div>
    <nav class="seg" aria-label="Views">
      <a href="#pipeline" data-view="pipeline">Pipeline</a>
      <a href="#list" data-view="list">List</a>
      <a href="#today" data-view="today">Today</a>
      <a href="#grants" data-view="grants">Grants</a>
      <a href="#longlist" data-view="longlist">Long list</a>
      <a href="#context" data-view="context">Our story</a>
    </nav>
    <div class="tools">
      <label class="search" for="q"><span class="muted" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search investors, portfolio, city" autocomplete="off"></label>
      <div class="peers" id="peers"></div>
      <span class="sync" id="sync" title="Connecting"></span>
      <label class="search" for="meSel" title="Who is using this screen. Drafts are written in this person's voice by default."><span class="muted">I am</span>
        <select id="meSel" style="border:0;background:transparent;outline:0;font-weight:600"><option value="athar">Athar</option><option value="deepesh">Deepesh</option></select></label>
      <button class="btn primary" id="addBtn" type="button">Add investor</button>
    </div>
  </div>
  <div class="wrap filters" id="filters"></div>
</header>

<main>
  <section class="wrap strip" id="strip"></section>
  <section id="view"></section>
</main>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ------------------------------------------------------------- constants --
const STAGES = [
  { id: 'target', label: 'Target' }, { id: 'warm', label: 'Warming up' }, { id: 'intro', label: 'Intro asked' },
  { id: 'contacted', label: 'Contacted' }, { id: 'meeting', label: 'Meeting' }, { id: 'diligence', label: 'Diligence' },
  { id: 'terms', label: 'Term sheet' }, { id: 'committed', label: 'Committed' },
];
const CLOSED = [{ id: 'later', label: 'Not now' }, { id: 'passed', label: 'Passed' }];
const ALL_STAGES = [...STAGES, ...CLOSED];
const STAGE_IDX = Object.fromEntries(ALL_STAGES.map((s, i) => [s.id, i]));
const TARGET_LAKH = 2600; // ₹26 crore seed
const KINDS = ['VC', 'Angel', 'Angel network', 'Accelerator', 'Platform'];
const TIERS = [{ id: 'A', label: 'A · best fit' }, { id: 'B', label: 'B · good' }, { id: 'C', label: 'C · long shot' }, { id: 'U', label: 'Unscreened' }];
const TEAM_DEFAULT = { athar: { key: 'athar', name: 'Athar Ali', role: 'Co-founder and CEO' }, deepesh: { key: 'deepesh', name: 'Deepesh Mahajan', role: 'Co-founder and CBO' } };
const ANGLES = {
  health: 'They already back health. Lead with the family memory, the prescription check and care booked in chat.',
  consumer: 'Consumer investor. Lead with the daily habit, organic growth and the ₹249 Family plan.',
  ai: 'Deep tech or AI leaning. Lead with the India health model, the 5,000-case eval set and clinician-signed rules.',
  program: 'Accelerator. Apply to the next cohort and ask how their first cheque and follow-on work.',
  general: 'Generalist. Lead with the size of the gap (79.7 cr ABHA IDs, 2-minute consults) and the V1 already built.',
};
const ACTIONS = [
  { id: 'warmup', label: 'Warm up', hint: 'No ask yet. Engage with their work and share the demo.' },
  { id: 'outreach', label: 'Outreach', hint: 'First pitch with a 20-minute ask.' },
  { id: 'intro', label: 'Intro request', hint: 'A forwardable note for whoever can introduce us.' },
  { id: 'followup', label: 'Follow up', hint: 'Builds on the last touch with one new piece of progress.' },
];
const CHANNELS = [{ id: 'email', label: 'Email' }, { id: 'whatsapp', label: 'WhatsApp' }, { id: 'linkedin', label: 'LinkedIn' }];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? new Date(s + (String(s).length === 10 ? 'T00:00' : '')).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
const fmtTime = t => new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtLakh = v => v >= 100 ? '₹' + (v / 100).toFixed(v % 100 ? 2 : 0).replace(/\.?0+$/, '') + ' cr' : '₹' + Math.round(v) + ' L';
const ago = t => { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };

// ------------------------------------------------------------------ state --
const S = {
  inv: new Map(), touches: new Map(), grants: new Map(), gFit: 'all', pool: [], context: '', team: { ...TEAM_DEFAULT },
  view: 'pipeline', q: '', kinds: new Set(), tiers: new Set(['A', 'B']), owner: 'all', showClosed: false,
  sort: { key: 'fit', dir: -1 }, poolQ: '', poolStatus: 'Unscreened', poolLimit: 150, colLimit: {},
  sheet: null, compose: { action: 'outreach', channel: 'email', sender: null, text: '', busy: false, ctl: null, extra: '' },
  db: null, user: null, room: null, sample: null, mcp: null, me: null, canEdit: false, live: false, peers: [], profiles: {},
  meKey: 'athar',
};
try { const p = JSON.parse(localStorage.getItem('cheeku-rt-prefs') || 'null'); if (p) { S.meKey = p.meKey || 'athar'; if (p.tiers) S.tiers = new Set(p.tiers); if (p.owner) S.owner = p.owner; } } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('cheeku-rt-prefs', JSON.stringify({ meKey: S.meKey, tiers: [...S.tiers], owner: S.owner })); } catch (e) {} };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2400); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) { if (el && el.select) { el.focus(); el.select(); toast('Selected. Press Ctrl+C or Cmd+C to copy.'); } else toast('Copy is blocked here. Select the text instead.'); }
}

// ------------------------------------------------------------- data layer --
const stamp = () => ({ updatedAt: Date.now(), updatedBy: (S.me && S.me.id) || null });
async function writeDoc(path, data) {
  if (!S.db || !S.canEdit) { toast('This view is read only.'); return false; }
  try { await S.db.doc(path).set(data); return true; } catch (e) { toast('Could not save. Try again.'); return false; }
}
async function patchDoc(path, patch) {
  if (!S.db || !S.canEdit) { toast('This view is read only.'); return false; }
  const m = /^investors\/(.+)$/.exec(path); if (m && (S.inv.get(m[1]) || {})._draft) return persistDraft(m[1]);
  try { await S.db.doc(path).update(patch); return true; } catch (e) { toast('Could not save. Try again.'); return false; }
}
// A new investor lives only on the page until it has a name; then the whole record is written at once.
async function persistDraft(id) {
  const it = S.inv.get(id); if (!it) return false;
  if (!String(it.name || '').trim()) { saveState('Add a name to save this investor', 'err'); return false; }
  const { id: _i, _draft, ...rec } = it;
  const ok = await writeDoc('investors/' + id, rec);
  if (ok) { const cur = S.inv.get(id); if (cur) delete cur._draft; toast(`${it.name} added to Target`); scheduleRender(); }
  return ok;
}
function touchesFor(id) { return [...S.touches.values()].filter(t => t.investorId === id).sort((a, b) => b.at - a.at); }
async function addTouch(investorId, t) {
  const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const doc = { investorId, at: Date.now(), by: (S.me && S.me.id) || null, sender: S.meKey, ...t };
  S.touches.set(id, { id, ...doc });
  return writeDoc('touches/' + id, doc);
}
async function setInv(id, patch, logText) {
  const it = S.inv.get(id); if (!it) return;
  const full = { ...patch, ...stamp() };
  S.inv.set(id, { ...it, ...full }); scheduleRender();
  const ok = await patchDoc('investors/' + id, full);
  if (ok && logText) addTouch(id, { type: 'stage', body: logText });
  return ok;
}
async function moveStage(id, stage) {
  const it = S.inv.get(id); if (!it || it.stage === stage) return;
  const lbl = (ALL_STAGES.find(s => s.id === stage) || {}).label || stage;
  await setInv(id, { stage }, `Moved to ${lbl}`);
}

function subscribe() {
  S.db.collection('investors').onSnapshot(snap => {
    const drafts = [...S.inv.values()].filter(x => x._draft);
    S.inv.clear(); snap.docs.forEach(d => S.inv.set(d.id, { id: d.id, ...d.data() }));
    drafts.forEach(x => { if (!S.inv.has(x.id)) S.inv.set(x.id, x); });
    S.live = true; setSync(); scheduleRender();
  }, () => setSync(true));
  S.db.collection('touches').onSnapshot(snap => {
    S.touches.clear(); snap.docs.forEach(d => S.touches.set(d.id, { id: d.id, ...d.data() }));
    scheduleRender(); if (S.sheet) renderTimeline();
  }, () => setSync(true));
  S.db.collection('pool').onSnapshot(snap => {
    const rows = []; [...snap.docs].sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true })).forEach(d => (d.data().rows || []).forEach((r, i) => rows.push({ ...r, _doc: d.id, _i: i })));
    S.pool = rows; if (S.view === 'longlist') scheduleRender();
  }, () => {});
  S.db.collection('grants').onSnapshot(snap => { S.grants.clear(); snap.docs.forEach(d => S.grants.set(d.id, { id: d.id, ...d.data() })); if (S.view === 'grants' || S.view === 'pipeline') scheduleRender(); }, () => {});
  S.db.doc('meta/context').onSnapshot(d => { S.context = d.exists ? (d.data().text || '') : ''; if (S.view === 'context') scheduleRender(); }, () => {});
  S.db.doc('meta/team').onSnapshot(d => { if (d.exists) { const t = {}; (d.data().members || []).forEach(m => { t[m.key] = m; }); S.team = { ...TEAM_DEFAULT, ...t }; } }, () => {});
}
function setSync(err) {
  const el = $('sync');
  el.className = 'sync' + (err ? ' err' : S.live ? ' live' : '');
  el.title = err ? 'Lost the connection to the shared tracker' : S.live ? 'Live: changes sync to Athar and Deepesh' : (S.db ? 'Connecting' : 'Shared tracker is not available in this view');
}
let queued = false;
function scheduleRender() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }

// ---------------------------------------------------------------- filters --
function hay(it) { return [it.name, it.firm, it.title, it.research && it.research.summary, it.city, it.portfolio, it.about, it.kind, it.intro, it.notes, (it.people || []).map(p => p.name).join(' ')].join(' ').toLowerCase(); }
function visible(it, ignoreStage) {
  if (S.q && !hay(it).includes(S.q)) return false;
  if (S.kinds.size && !S.kinds.has(it.kind)) return false;
  if (it._draft) return false;
  const tier = it.tier || 'U', byHand = (it.sources || []).includes('added by hand');
  if (S.tiers.size && !S.tiers.has(tier) && !byHand && (it.stage || 'target') === 'target') return false; // tiers filter the Target pile; anyone in play always shows
  if (S.owner === 'none' && it.owner) return false;
  if (S.owner !== 'all' && S.owner !== 'none' && it.owner !== S.owner) return false;
  return true;
}
function renderFilters() {
  const kindChips = KINDS.map(k => `<button class="chip" data-kind="${k}" aria-pressed="${S.kinds.has(k)}">${k}</button>`).join('');
  const tierChips = TIERS.map(t => `<button class="chip" data-tier="${t.id}" aria-pressed="${S.tiers.has(t.id)}">${t.label}</button>`).join('');
  const own = [['all', 'Everyone'], ['athar', 'Athar'], ['deepesh', 'Deepesh'], ['none', 'Unassigned']].map(([k, l]) => `<button class="chip" data-owner="${k}" aria-pressed="${S.owner === k}">${k === 'athar' || k === 'deepesh' ? `<i style="background:var(--o-${k})"></i>` : ''}${l}</button>`).join('');
  $('filters').innerHTML = S.view === 'longlist' || S.view === 'context' || S.view === 'grants' ? '' :
    `<span class="fgroup">Fit ${tierChips}</span><span class="fgroup">Type ${kindChips}</span><span class="fgroup">Lead ${own}</span>
     ${S.view === 'pipeline' ? `<button class="chip" id="closedT" aria-pressed="${S.showClosed}">Show passed and not now</button>` : ''}`;
}

// ------------------------------------------------------------------ strip --
function renderStrip() {
  const all = [...S.inv.values()];
  const committed = all.filter(i => i.stage === 'committed').reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const soft = all.filter(i => i.stage === 'terms' || i.stage === 'diligence').reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const counts = Object.fromEntries(STAGES.map(s => [s.id, 0])); all.forEach(i => { if (counts[i.stage || 'target'] !== undefined) counts[i.stage || 'target']++; });
  const max = Math.max(1, ...STAGES.slice(1).map(s => counts[s.id]));
  const pc = v => Math.min(100, v / TARGET_LAKH * 100);
  const active = all.filter(i => !['target', 'passed', 'later'].includes(i.stage || 'target')).length;
  $('strip').innerHTML = `
    <div class="raise">
      <h1>Seed · <span>₹26 crore</span></h1>
      <p>${active} investors in play, ${all.length} in the tracker. The meter counts what investors have said yes to, in ₹ lakh on each record.</p>
      <div class="meter" role="img" aria-label="${fmtLakh(committed)} committed and ${fmtLakh(soft)} in diligence or term sheet, of ₹26 crore"><i class="c" style="width:${pc(committed)}%"></i><i class="s" style="width:${Math.min(100 - pc(committed), pc(soft))}%"></i></div>
      <div class="legend num"><span><b>${fmtLakh(committed)}</b> committed</span><span><b>${fmtLakh(soft)}</b> in diligence or terms</span><span><b>${fmtLakh(Math.max(0, TARGET_LAKH - committed))}</b> to go</span>${(() => { const won = [...S.grants.values()].filter(g => g.stage === 'Won').reduce((a, g) => a + (Number(g.awardLakh) || 0), 0); const live = [...S.grants.values()].filter(g => ['Preparing', 'Applied', 'Shortlisted'].includes(g.stage)).length; return won || live ? `<span><b>${fmtLakh(won)}</b> in grants won${live ? `, ${live} in progress` : ''}</span>` : ''; })()}</div>
    </div>
    <div class="funnel">${STAGES.map(s => `<button class="fstep" type="button" data-jump="${s.id}"><span>${s.label}</span><b class="num">${counts[s.id]}</b><i class="bar-s" style="width:${s.id === 'target' ? 100 : Math.max(4, counts[s.id] / max * 100)}%"></i></button>`).join('')}</div>`;
}

// --------------------------------------------------------------- pipeline --
function card(it) {
  const t = it.tier || 'U';
  const nd = it.nextDate; const late = nd && nd < today(); const dueToday = nd === today();
  const watchers = S.peers.filter(p => !p.isMe && p.presence && p.presence.viewing === it.id);
  return `<button class="card" type="button" draggable="${S.canEdit}" data-id="${esc(it.id)}">
    ${watchers.length ? `<span class="watch">${watchers.slice(0, 2).map(p => face(p.by, 'sm')).join('')}</span>` : ''}
    <span class="card-t"><span class="tier ${t}" title="Fit tier">${t === 'U' ? '?' : t}</span><b>${esc(it.name)}</b>${ownerAv(it.owner, 'sm')}</span>
    ${it.firm || it.title ? `<span class="card-m" style="color:var(--ink-2)">${esc([it.title, it.firm].filter(Boolean).join(', '))}</span>` : ''}
    <span class="card-m"><span class="pill k-${esc((it.kind || 'VC').replace(/ /g, '-'))}">${esc(it.kind || 'VC')}</span>${it.research && it.research.status === 'queued' ? '<span class="due" title="Waiting for Claude to research">researching</span>' : ''}${it.fit != null ? `<span class="num">fit ${it.fit}</span>` : ''}${it.amount ? `<span class="num">${fmtLakh(Number(it.amount))}</span>` : ''}${(it.flags || []).length ? `<span class="flag" title="${esc(it.flags.join('. '))}">⚑</span>` : ''}</span>
    ${it.nextStep || nd ? `<span class="card-m"><span class="${late ? 'due late' : dueToday ? 'due' : ''}">${nd ? fmtDate(nd) + ' · ' : ''}</span>${esc((it.nextStep || '').slice(0, 60))}</span>` : ''}
  </button>`;
}
function ownerAv(key, cls = '') { if (!key) return `<span class="av ${cls}" title="No lead yet">·</span>`; const m = S.team[key] || {}; return `<span class="av ${cls} ${key}" title="${esc((m.name || key) + ' leads')}">${esc((m.name || key)[0])}</span>`; }
function face(by, cls = '') { const p = S.profiles[by]; const n = (p && p.name) || '?'; if (p && p.avatarUrl) return `<img class="av ${cls}" alt="${esc(n)}" src="${esc(p.avatarUrl)}" style="object-fit:cover">`; return `<span class="av ${cls}" title="${esc(n)}">${esc(n[0].toUpperCase())}</span>`; }
const byFit = (a, b) => (STAGE_IDX[b.stage] - STAGE_IDX[a.stage]) || ((b.fit ?? -1) - (a.fit ?? -1)) || a.name.localeCompare(b.name);
function renderPipeline() {
  const items = [...S.inv.values()].filter(it => visible(it));
  const stages = S.showClosed ? ALL_STAGES : STAGES;
  if (!S.inv.size) return emptyState();
  return `<div class="board wrap"><div class="cols">${stages.map(s => {
    const col = items.filter(it => (it.stage || 'target') === s.id).sort((a, b) => {
      if (s.id === 'target') return (b.fit ?? -1) - (a.fit ?? -1);
      return (a.nextDate || '9999').localeCompare(b.nextDate || '9999') || (b.fit ?? -1) - (a.fit ?? -1);
    });
    const lim = S.colLimit[s.id] || (s.id === 'target' ? 40 : 200);
    return `<div class="col" data-stage="${s.id}"><div class="col-h"><h3>${s.label}</h3><span class="num">${col.length}${s.id === 'committed' ? ' · ' + fmtLakh(col.reduce((a, i) => a + (Number(i.amount) || 0), 0)) : ''}</span></div>
      ${col.slice(0, lim).map(card).join('') || `<div class="empty-col">${s.id === 'target' ? 'No targets match the filters.' : 'Drag an investor here.'}</div>`}
      ${col.length > lim ? `<button class="more" data-more="${s.id}">Show ${Math.min(80, col.length - lim)} more of ${col.length - lim}</button>` : ''}</div>`;
  }).join('')}</div></div>`;
}
function emptyState() {
  return `<div class="emptyst wrap"><b>No investors yet</b><span>Investors you add, or the screened lists Claude loads, show up here as cards in the funnel.</span>${S.canEdit ? '<button class="btn primary" data-act="add">Add the first investor</button>' : ''}</div>`;
}

// ------------------------------------------------------------------- list --
function renderList() {
  const items = [...S.inv.values()].filter(it => visible(it));
  const k = S.sort.key, dir = S.sort.dir;
  const val = it => k === 'stage' ? STAGE_IDX[it.stage || 'target'] : k === 'lastTouch' ? (it.lastTouch || 0) : k === 'fit' ? (it.fit ?? -1) : String(it[k] || '').toLowerCase();
  items.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
  const th = (key, l) => `<th><button data-sort="${key}">${l}${S.sort.key === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</button></th>`;
  return `<div class="wrap"><div class="tablewrap"><table><thead><tr>${th('name', 'Investor')}${th('kind', 'Type')}${th('fit', 'Fit')}${th('stage', 'Stage')}${th('owner', 'Lead')}${th('nextDate', 'Next')}${th('lastTouch', 'Last touch')}${th('city', 'City')}<th>Why they fit</th></tr></thead>
  <tbody>${items.slice(0, 500).map(it => `<tr data-id="${esc(it.id)}"><td><span class="tier ${it.tier || 'U'}">${it.tier === 'U' || !it.tier ? '?' : it.tier}</span> <b>${esc(it.name)}</b></td><td><span class="pill k-${esc((it.kind || 'VC').replace(/ /g, '-'))}">${esc(it.kind)}</span></td><td class="num">${it.fit ?? ''}</td><td>${esc((ALL_STAGES.find(s => s.id === (it.stage || 'target')) || {}).label)}</td><td>${ownerAv(it.owner, 'sm')}</td><td class="num ${it.nextDate && it.nextDate < today() ? 'due late' : ''}">${fmtDate(it.nextDate)} ${esc((it.nextStep || '').slice(0, 40))}</td><td class="num muted">${it.lastTouch ? ago(it.lastTouch) : ''}</td><td>${esc(it.city || '')}</td><td class="wrapc">${esc((it.why || []).slice(0, 2).join('; '))}</td></tr>`).join('')}</tbody></table></div>
  <p class="muted" style="font-size:12px">${items.length} investors${items.length > 500 ? ', first 500 shown. Narrow the filters to see the rest.' : ''}</p></div>`;
}

// ------------------------------------------------------------------ today --
function renderToday() {
  const all = [...S.inv.values()];
  const t = today();
  const due = all.filter(i => i.nextDate && i.nextDate <= t && !['passed', 'later', 'committed'].includes(i.stage)).sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const live = ['warm', 'intro', 'contacted', 'meeting', 'diligence', 'terms'];
  const stale = all.filter(i => live.includes(i.stage) && (!i.lastTouch || Date.now() - i.lastTouch > 10 * 864e5) && !(i.nextDate && i.nextDate > t)).sort((a, b) => (a.lastTouch || 0) - (b.lastTouch || 0));
  const queued = all.filter(i => i.research && i.research.status === 'queued').sort((a, b) => a.research.at - b.research.at);

    if (d.ev) { const ev = t.closest('.ev'); if (ev) ev.classList.toggle('open'); return; }

document.addEventListener('click', e => { const ev = e.target.closest('.ev[data-ev]'); if (ev && !e.target.closest('button,a')) ev.classList.toggle('open'); });

async function addInvestor() {

function presence(patch) { S.presence = { ...(S.presence || {}), ...patch }; if (S.room) S.room.presence(S.presence).catch(() => {}); }
async function profilesFor(ids) { ids = [...new Set(ids.filter(Boolean))]; if (!ids.length || !S.user) return {}; try { const ps = await S.user.profiles(ids); Object.assign(S.profiles, ps); return ps; } catch (e) { return {}; } }
function renderPeers() { const u = []; const seen = new Set(); S.peers.forEach(p => { if (p.by && !seen.has(p.by)) { seen.add(p.by); u.push(p); } }); $('peers').innerHTML = u.slice(0, 4).map(p => face(p.by)).join(''); }

function route() { const h = (location.hash || '').slice(1); S.view = ['pipeline', 'list', 'today', 'grants', 'longlist', 'context'].includes(h) ? h : 'pipeline'; render(); }

(async () => {
  const c = window.claude; if (!c || !c.use) { setSync(); return; }
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  S.db = db; S.user = user;
  if (user) { try { S.me = await user.me(); S.canEdit = !!S.me.canEdit; const n = (S.me.name || '').toLowerCase(); let had = null; try { had = localStorage.getItem('cheeku-rt-prefs'); } catch (e) {} if (!had) { if (n.includes('deepesh')) S.meKey = 'deepesh'; else if (n.includes('athar')) S.meKey = 'athar'; } } catch (e) {} }
  setSync(); if (db) subscribe(); render();

})();
