<title>Cheeku Vision Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: a calm planning surface for a big screen. One translucent toolbar, a thin plan strip, then the timeline:
   quarters across, lanes as thin bands, cards that open into a focused sheet for discussion. */
:root {
  --bg: #F5F5F7; --surface: #FFFFFF; --surface-2: #F2F2F5; --surface-3: #E8E8ED;
  --ink: #1D1D1F; --ink-2: #3A3A3F; --muted: #6E6E73; --faint: #A1A1A6;
  --line: rgba(20, 20, 40, .08); --line-2: rgba(20, 20, 40, .14);
  --accent: #5B4EF0; --accent-2: #4536D9; --accent-soft: #EEECFF; --on-accent: #FFFFFF;
  --lime: #E4FF7A; --lime-ink: #2F3D00; --navy: #14136B; --on-navy: #FFFFFF;
  --good: #248A3D; --warn: #B86E00; --bad: #D70015; --risk: #D9531E;
  --l-product: #5B4EF0; --l-ai: #0A9396; --l-supply: #2E8B57; --l-growth: #D9822B; --l-revenue: #C8417F;
  --l-b2b: #2F6FDE; --l-funding: #8E6A2E; --l-team: #6C6F86; --l-trust: #C2481B;
  --o-athar: #5B4EF0; --o-suraj: #0A8577; --o-deepesh: #C9620F;
  --sh-1: 0 0 0 0.5px rgba(20, 20, 40, .08), 0 1px 2px rgba(20, 20, 40, .05), 0 2px 8px rgba(20, 20, 40, .035);
  --sh-2: 0 0 0 0.5px rgba(20, 20, 40, .1), 0 6px 16px rgba(20, 20, 40, .08), 0 16px 36px rgba(20, 20, 40, .06);
  --sh-sheet: 0 0 0 0.5px rgba(20, 20, 40, .12), 0 30px 90px rgba(20, 20, 40, .28);
  --glass: rgba(255, 255, 255, .72);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
  --brand: 'Instrument Serif', Georgia, serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-io: cubic-bezier(0.77, 0, 0.175, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --colw: 256px; --barh: 52px; --subh: 46px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0B0E; --surface: #1C1C1F; --surface-2: #242428; --surface-3: #2F2F35;
  --ink: #F5F5F7; --ink-2: #D6D6DC; --muted: #98989F; --faint: #63636B; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --accent: #8F87FF; --accent-2: #B3ADFF; --accent-soft: #24213F; --on-accent: #0B0B0E;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2C2A85; --on-navy: #FFFFFF;
  --good: #32D06A; --warn: #FFB340; --bad: #FF6B6B; --risk: #FF8A5C;
  --l-product: #9A92FF; --l-ai: #3CCACC; --l-supply: #5FC57E; --l-growth: #F2A54A; --l-revenue: #F07AB5;
  --l-b2b: #74A3FF; --l-funding: #D2A262; --l-team: #A5A8C0; --l-trust: #F2834F;
  --o-athar: #8F87FF; --o-suraj: #2FB8A6; --o-deepesh: #F0913C;
  --sh-1: 0 0 0 0.5px rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-2: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .5);
  --sh-sheet: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 30px 90px rgba(0, 0, 0, .65);
  --glass: rgba(28, 28, 31, .72);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B0B0E; --surface: #1C1C1F; --surface-2: #242428; --surface-3: #2F2F35;
  --ink: #F5F5F7; --ink-2: #D6D6DC; --muted: #98989F; --faint: #63636B; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --accent: #8F87FF; --accent-2: #B3ADFF; --accent-soft: #24213F; --on-accent: #0B0B0E;
  --lime: #D6F25C; --lime-ink: #1E2700; --navy: #2C2A85; --on-navy: #FFFFFF;
  --good: #32D06A; --warn: #FFB340; --bad: #FF6B6B; --risk: #FF8A5C;
  --l-product: #9A92FF; --l-ai: #3CCACC; --l-supply: #5FC57E; --l-growth: #F2A54A; --l-revenue: #F07AB5;
  --l-b2b: #74A3FF; --l-funding: #D2A262; --l-team: #A5A8C0; --l-trust: #F2834F;
  --o-athar: #8F87FF; --o-suraj: #2FB8A6; --o-deepesh: #F0913C;
  --sh-1: 0 0 0 0.5px rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-2: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .5);
  --sh-sheet: 0 0 0 0.5px rgba(255, 255, 255, .12), 0 30px 90px rgba(0, 0, 0, .65);
  --glass: rgba(28, 28, 31, .72);
  color-scheme: dark; }
@media (min-width: 1700px) { :root { --colw: 280px; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-optical-sizing: auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Toolbar: one translucent bar; content scrolls under it */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid var(--line-2); }
.bar-in { height: var(--barh); display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 20px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font: italic 400 26px/1 var(--brand); color: var(--accent); letter-spacing: -0.01em; }
.brand span { font: 600 12px/1 var(--font); color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 2px; gap: 2px; position: relative; }
.seg > a, .seg > button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background-color 160ms ease, color 160ms ease; }
.seg > [aria-current="page"], .seg > [aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 0.5px var(--line-2), 0 1px 3px rgba(0, 0, 0, .1); font-weight: 600; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; }
.ibtn { height: 32px; min-width: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 500; font-size: 13px; transition: background-color 140ms ease, transform 120ms var(--ease-out); white-space: nowrap; }
.ibtn:hover { background: var(--surface-3); }
.ibtn:active { transform: scale(.96); }
.ibtn.on { background: var(--accent-soft); color: var(--accent-2); }
.ibtn.primary { background: var(--accent); color: var(--on-accent); padding: 0 12px; font-weight: 600; }
.ibtn.primary:hover { background: var(--accent-2); }
.ibtn .count { min-width: 17px; height: 17px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 5px; }
.search { height: 32px; width: 168px; border: 0; border-radius: 8px; background: var(--surface-3); padding: 0 10px 0 30px; font-size: 13px; transition: width 220ms var(--ease-out), background-color 140ms ease; }
.search:focus { width: 240px; background: var(--surface); outline: 2px solid var(--accent); outline-offset: 0; }
.search-wrap { position: relative; display: flex; align-items: center; }
.search-wrap svg { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
.peers { display: flex; padding-inline: 4px; }
.peers img, .peers .av { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -7px; background-color: var(--surface-3); box-sizing: content-box; }
.peers .av { font-size: 11px; }
.sync { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; margin-inline: 4px; }
.sync.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); } .sync.err { background: var(--bad); }
.anchor { position: relative; }

/* Plan strip */
.sub { background: var(--bg); border-bottom: 0.5px solid var(--line-2); }
.sub-in > * { flex: none; }
.sub-in { height: var(--subh); display: flex; align-items: center; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-block: 6px; }
.sub-in::-webkit-scrollbar { display: none; }
.stats { display: flex; gap: 18px; align-items: baseline; white-space: nowrap; font-size: 12.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin-right: 4px; }
.stats b.neg { color: var(--bad); }
.whatif { display: inline-flex; align-items: center; gap: 8px; background: var(--lime); color: var(--lime-ink); padding: 4px 6px 4px 12px; border-radius: 999px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.whatif button { border: 0; background: rgba(255, 255, 255, .7); color: #1D1D1F; border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: 12px; }
.tokens { display: flex; gap: 6px; }
.token { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 0.5px var(--line-2); font-size: 12px; font-weight: 500; white-space: nowrap; border: 0; }
.token svg { width: 12px; height: 12px; color: var(--muted); }
.spacer { flex: 1; }

/* Popovers: scale from their trigger */
.pop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 35; min-width: 300px; max-width: min(560px, calc(100vw - 32px)); background: var(--surface); border-radius: 14px; box-shadow: var(--sh-2); padding: 14px; transform-origin: top right; opacity: 0; transform: scale(.96) translateY(-4px); pointer-events: none; transition: opacity 120ms ease-out, transform 140ms var(--ease-out); }
.pop.left { right: auto; left: 0; transform-origin: top left; }
.pop.on { opacity: 1; transform: none; pointer-events: auto; transition: opacity 160ms ease-out, transform 220ms var(--ease-out); }
.pop h5 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pop section + section { margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--line-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 500; transition: background-color 140ms ease, transform 120ms var(--ease-out); }
.chip:hover { background: var(--surface-3); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.levers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.lever { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.lever label { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.lever output { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lever input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.feed { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; }
.feed div { font-size: 12.5px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; line-height: 1.4; }
.feed img, .feed .av { width: 22px; height: 22px; border-radius: 50%; }

/* Board */
.board { overflow: auto; height: calc(100dvh - var(--barh) - var(--subh) - 1px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); position: relative; overscroll-behavior: contain; }
.grid { display: grid; position: relative; min-width: max-content; }
.ph { position: sticky; top: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 95%, transparent); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-bottom: 0.5px solid var(--line-2); padding: 10px 14px 9px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; }
.ph:hover .ph-label { color: var(--accent-2); }
.ph + .ph { border-left: 0.5px solid var(--line); }
.ph.now { box-shadow: inset 0 2px 0 var(--accent); }
.ph-top { display: flex; align-items: baseline; gap: 8px; }
.ph-label { font: 600 15px/1.2 var(--display); letter-spacing: -0.015em; transition: color 140ms ease; }
.ph-sub { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.ph-sub.now { color: var(--accent-2); }
.ph-num { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ph-num b { color: var(--ink-2); font-weight: 600; }
.ph-num b.neg { color: var(--bad); }
.evs { display: flex; gap: 4px; min-height: 0; flex-wrap: wrap; }
.ev { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--navy); color: var(--on-navy); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.ev.lime { background: var(--lime); color: var(--lime-ink); }
.ev.more { background: var(--surface-3); color: var(--muted); }
.ph-pop h5 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ph-pop { position: absolute; top: calc(100% + 6px); left: 8px; right: 8px; z-index: 12; background: var(--surface); border-radius: 12px; box-shadow: var(--sh-2); padding: 12px 14px; cursor: default; transform-origin: top center; animation: pop-in 200ms var(--ease-out); }
.ph-pop dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 12.5px; }
.ph-pop dt { color: var(--muted); } .ph-pop dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ph-pop .ev-list { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--line-2); display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
@keyframes pop-in { from { opacity: 0; transform: scale(.97) translateY(-4px); } }

.lane { grid-column: 1 / -1; height: 38px; display: flex; align-items: center; border-top: 0.5px solid var(--line-2); background: var(--bg); position: relative; z-index: 2; }
.lane-in { position: sticky; left: 0; display: flex; align-items: center; gap: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 16px; height: 100%; }
.lane-tog { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 8px 4px 4px; margin-left: -4px; border-radius: 8px; font-weight: 600; font-size: 13px; letter-spacing: -0.005em; }
.lane-tog:hover { background: var(--surface-3); }
.lane-tog svg { color: var(--muted); transition: transform 220ms var(--ease-out); }
.lane.closed .lane-tog svg { transform: rotate(-90deg); }
.lane-sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.lane-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.lane-bar i { display: block; }
.lane-bar { display: flex; width: 72px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--surface-3); gap: 1px; }
.cell { padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 64px; min-width: 0; position: relative; transition: background-color 160ms ease; }
.cell + .cell, .cell:not(:first-of-type) { border-left: 0.5px solid var(--line); }
.cell.now { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.cell.over { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
.cell .add { opacity: 0; align-self: stretch; border: 0; border-radius: 10px; background: transparent; height: 30px; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 140ms ease, background-color 140ms ease; }
.cell .add:hover { background: var(--surface-3); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .cell:hover .add { opacity: 1; } }
.cell .add:focus-visible { opacity: 1; }
.empty-cell { flex: 1; }

/* Cards */
.card { position: relative; background: var(--surface); border-radius: 12px; padding: 10px 12px 10px; box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: box-shadow 200ms var(--ease-out), transform 160ms var(--ease-out), opacity 200ms ease; outline: none; }
@media (hover: hover) and (pointer: fine) { .card:hover { box-shadow: var(--sh-2); transform: translateY(-1px); } }
.card:active { transform: scale(.985); }
.card:focus-visible { box-shadow: 0 0 0 2px var(--accent), var(--sh-2); }
.card.rel { box-shadow: 0 0 0 1.5px var(--warn), var(--sh-1); }
.card.dragging { opacity: .35; transform: scale(.98); }
.card.moved { animation: moved 1.4s var(--ease-out); }
@keyframes moved { 0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent), var(--sh-2); } 100% { box-shadow: 0 0 0 0 transparent, var(--sh-1); } }
.card.st-done .c-title { color: var(--muted); }
.card.st-dropped { opacity: .5; }
.card.st-dropped .c-title { text-decoration: line-through; }
.c-top { display: flex; flex-wrap: wrap; row-gap: 5px; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .01em; min-height: 16px; }
.glyph { width: 10px; height: 10px; flex: none; }
.when { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); font-size: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.when svg { width: 10px; height: 10px; }
.c-title { font: 600 13.5px/1.32 var(--font); letter-spacing: -0.008em; color: var(--ink); overflow-wrap: anywhere; }
.c-meta { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.av { width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; color: #fff; flex: none; letter-spacing: 0; }
.av.athar { background: var(--o-athar); } .av.suraj { background: var(--o-suraj); } .av.deepesh { background: var(--o-deepesh); }
.av.none { background: var(--surface-3); color: var(--muted); }
.pri { font-size: 10.5px; font-weight: 700; padding: 0 5px; height: 17px; display: inline-flex; align-items: center; border-radius: 5px; letter-spacing: .02em; }
.pri.P0 { background: var(--ink); color: var(--bg); }
.pri.P1 { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.s-idea { background: var(--faint); } .s-planned { background: var(--accent); } .s-in_progress { background: var(--warn); }
.s-done { background: var(--good); } .s-at_risk { background: var(--risk); } .s-blocked { background: var(--bad); } .s-dropped { background: var(--line-2); }
.tg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tg i { width: 6px; height: 6px; border-radius: 2px; display: inline-block; }
.deps { display: inline-flex; align-items: center; gap: 3px; }
.deps svg { width: 12px; height: 12px; }
.c-exp { margin-left: auto; width: 24px; height: 22px; border-radius: 7px; border: 0; background: transparent; color: var(--faint); display: grid; place-items: center; padding: 0; transition: background-color 120ms ease, color 120ms ease, transform 120ms var(--ease-out); }
.c-exp:active { transform: scale(.9); }
.c-exp svg { width: 15px; height: 15px; }
.card.open .c-exp { color: var(--accent-2); background: var(--accent-soft); }
.c-exp:hover { background: var(--surface-3); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .card:hover .c-exp { color: var(--muted); } .card:hover .c-exp:hover, .card.open .c-exp:hover { color: var(--accent-2); background: var(--accent-soft); } }
.card.sel { box-shadow: 0 0 0 2px var(--accent), var(--sh-2); }
.c-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms var(--ease-out); }
.card.open .c-more { grid-template-rows: 1fr; }
.c-more > div { overflow: hidden; min-height: 0; }
.c-more > div > :first-child { margin-top: 4px; }
.c-why { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.c-done { display: flex; gap: 6px; font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.4; }
.c-done svg { width: 13px; height: 13px; color: var(--good); margin-top: 2px; }
.conf { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.conf span { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.conf span i { display: block; height: 100%; background: var(--accent); }
.peek { position: absolute; top: -7px; right: -5px; display: flex; }
.peek img, .peek .av { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); box-sizing: content-box; }
.peek .av { font-size: 9px; }
.enter .card { animation: rise 380ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 18ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* Sheet: the card, big, for discussion */
.scrim { position: fixed; inset: 0; z-index: 45; background: rgba(10, 10, 20, .38); opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 50; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-sheet); display: none; flex-direction: column; overflow: hidden; transform-origin: top left; }
.sheet.on { display: flex; }
.sh-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 12px 22px; border-bottom: 0.5px solid var(--line-2); min-height: 56px; }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; flex: 0 1 auto; }
.crumb b { overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); font-weight: 600; }
.pos { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; margin-right: 6px; white-space: nowrap; }
.sh-body { overflow-y: auto; padding: 26px 30px 30px; }
.sh-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 1fr); gap: 34px; }
.sh-kind { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-bottom: 10px; }
.sh-title { font: 600 30px/1.15 var(--display); letter-spacing: -0.022em; margin-bottom: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.fact { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.fact .av { width: 20px; height: 20px; }
.blk { margin-bottom: 22px; }
.blk h6 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.blk p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink-2); max-width: 62ch; white-space: pre-wrap; }
.blk p.empty { color: var(--faint); font-size: 14px; }
.donebox { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--good) 9%, var(--surface)); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; color: var(--ink); }
.donebox svg { color: var(--good); width: 18px; height: 18px; margin-top: 1px; }
.side { display: flex; flex-direction: column; gap: 14px; }
.box { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; }
.box h6 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.big-when { font: 600 22px/1.15 var(--display); letter-spacing: -0.015em; }
.box p { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.links { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.links button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; text-align: left; font-size: 13px; color: var(--ink); min-width: 0; }
.links button:hover { background: var(--surface-3); }
.links button span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links button span.p { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.vote-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.sh-foot { font-size: 12px; color: var(--muted); margin-top: 8px; }
.keys { font-size: 12px; color: var(--faint); display: flex; gap: 14px; flex-wrap: wrap; }
.keys kbd { font: 600 11px/1 var(--font); color: var(--muted); padding: 2px 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); margin-right: 4px; }
.sheet:focus { outline: none; }
.sh-top .ibtn { color: var(--ink-2); }
.sh-swap { animation: swap 200ms var(--ease-out); }
@keyframes swap { from { opacity: .4; transform: translateX(var(--dx, 0)); } }

/* Forms inside the sheet */
.form { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px 28px; }
.form .full { grid-column: 1 / -1; }
.form .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.field input[type=range] { accent-color: var(--accent); width: 100%; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input[type=text], .field input[type=number], .field select, .field textarea { border: 0; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--surface); border-radius: 10px; padding: 9px 11px; width: 100%; font-size: 14px; transition: box-shadow 140ms ease; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.field input.title-in { font: 600 22px/1.25 var(--display); letter-spacing: -0.015em; padding: 10px 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gatebox { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.lands { font-size: 13px; font-weight: 600; color: var(--accent-2); display: flex; gap: 6px; align-items: flex-start; }
.tchip { font-size: 12.5px; font-weight: 500; height: 28px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tchip i { width: 7px; height: 7px; border-radius: 2px; }
.tchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.deplist { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); padding: 6px; }
.deplist label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.deplist label:hover { background: var(--surface-2); }
.confirm { display: none; gap: 8px; align-items: center; font-size: 13px; }
.confirm.on { display: inline-flex; }
.btn { height: 34px; border: 0; border-radius: 9px; padding: 0 14px; font-weight: 600; font-size: 13px; background: var(--surface-3); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: transform 120ms var(--ease-out), background-color 140ms ease; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: transparent; color: var(--bad); }
.btn.ghost { background: transparent; color: var(--muted); }
.sh-actions { display: flex; gap: 8px; align-items: center; padding: 12px 22px; border-top: 0.5px solid var(--line-2); }

/* Other views */
.view > * { flex: none; }
.view { padding-block: 26px 48px; display: flex; flex-direction: column; gap: 20px; overflow: auto; height: calc(100dvh - var(--barh) - var(--subh) - 1px); }
.vhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.vhead h2 { font: 700 30px/1.1 var(--display); letter-spacing: -0.025em; }
.vhead h2 i { font-style: normal; color: var(--accent); }
.vhead p { color: var(--muted); max-width: 70ch; margin: 0; font-size: 14px; }
.panel { background: var(--surface); border-radius: 18px; padding: 20px; min-width: 0; box-shadow: var(--sh-1); }
.panel h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.cols2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.cols2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1000px) { .cols2, .cols2.even { grid-template-columns: 1fr; } }
.ocol { display: flex; flex-direction: column; gap: 8px; }
.ohead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.ohead .av { width: 32px; height: 32px; font-size: 14px; }
.ohead b { font: 700 22px/1 var(--display); letter-spacing: -0.02em; }
.stbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-3); gap: 1px; margin-bottom: 6px; }
.pgroup { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.tbl-wrap { overflow-x: auto; }
table.kpi { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.kpi th, table.kpi td { padding: 7px 9px; border-bottom: 0.5px solid var(--line-2); text-align: right; white-space: nowrap; }
table.kpi th:first-child, table.kpi td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.kpi thead th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.prog { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: var(--good); }
.heat { display: grid; grid-template-columns: 24px repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(66px, auto)) 24px; gap: 4px; }
.hc { border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.hax { font-size: 11px; color: var(--muted); display: grid; place-items: center; font-weight: 600; }
.rbub { border: 0; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform 120ms var(--ease-out); }
.rbub:active { transform: scale(.96); }
.rrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 8px; border-radius: 10px; cursor: pointer; transition: background-color 140ms ease; }
.rrow + .rrow { border-top: 0.5px solid var(--line); }
.rrow:hover { background: var(--surface-2); }
.score { font: 700 24px/1 var(--display); text-align: center; letter-spacing: -0.02em; }
.meta { font-size: 12.5px; color: var(--muted); }
.chip-ro { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.moat { display: grid; grid-template-columns: minmax(200px, 1.1fr) repeat(5, minmax(110px, 1fr)); }
.moat > div { padding: 14px 10px; border-bottom: 0.5px solid var(--line-2); min-width: 0; }
.moat .mname b { font: 600 17px/1.2 var(--display); letter-spacing: -0.012em; display: block; margin-bottom: 4px; }
.mstr { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.mstr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.mdots { display: flex; flex-wrap: wrap; gap: 3px; }
.mdots button { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--accent); background: transparent; padding: 0; transition: transform 120ms var(--ease-out); }
.mdots button:hover { transform: scale(1.25); }
.mdots button.done { background: var(--accent); }
.mdots button.in_progress { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.mval { font-size: 12px; color: var(--muted); }
.mval b { color: var(--ink); font-variant-numeric: tabular-nums; }
.flabel { display: block; }
.dec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 6px; }
.dec + .dec { border-top: 0.5px solid var(--line-2); }
.dec h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.dec h4 a { color: inherit; text-decoration: none; }
.dec h4 a:hover { color: var(--accent-2); }
.votes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vbtn { border: 0; background: var(--surface-2); padding: 0 12px; height: 28px; border-radius: 999px; font-size: 12.5px; font-weight: 600; transition: transform 120ms var(--ease-out), background-color 140ms ease; }
.vbtn:active { transform: scale(.95); }
.vbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.vfaces { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.vfaces img, .vfaces .av { width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; }
.ctop { display: flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.notice { background: var(--surface); box-shadow: var(--sh-1); border-radius: 12px; padding: 12px 16px; color: var(--muted); font-size: 13px; margin-block: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; transition: opacity 160ms ease-out, transform 220ms var(--ease-out); max-width: calc(100% - 32px); box-shadow: var(--sh-2); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }


/* Tag pills: type is solid, layer is tinted */
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; flex: none; }
.pill.type { background: var(--c); color: #fff; }
.pill.layer { background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: color-mix(in srgb, var(--c) 85%, var(--ink)); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--c) 35%, transparent); }
:root[data-theme="dark"] .pill.layer { color: color-mix(in srgb, var(--c) 45%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.layer { color: color-mix(in srgb, var(--c) 45%, white); } }
.pill.lg { height: 24px; padding: 0 10px; font-size: 12px; }
.c-top .kind { display: inline-flex; align-items: center; gap: 5px; }
.chip .pill { height: 16px; font-size: 10px; padding: 0 6px; }

/* Sheet v3 */
.sh-body.sx { padding: 0; }
.sx-hero { padding: 26px 32px 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--lc) 11%, var(--surface)) 0%, var(--surface) 100%); border-bottom: 0.5px solid var(--line); }
.sx-tagrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.sx-kind { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 0.5px var(--line-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sx-tagrow .tg { font-size: 12px; color: var(--ink-2); margin-left: 4px; }
.sx-title { font: 650 32px/1.12 var(--display); letter-spacing: -0.024em; margin: 0 0 20px; max-width: 32ch; }
.sx-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); }
.sx-stat { padding: 12px 16px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sx-stat + .sx-stat { border-left: 0.5px solid var(--line-2); }
.sx-stat small { font-size: 10.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sx-stat b { font: 600 15px/1.25 var(--display); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; min-height: 30px; }
.sx-stat b .av { width: 24px; height: 24px; font-size: 11px; }
.sx-stat .sx-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.sx-stat .pri { height: 20px; font-size: 11px; }
.ring { flex: none; }
.ring circle + circle { transition: stroke-dasharray 500ms var(--ease-out); }
.sx-track { display: flex; align-items: center; margin-top: 18px; }
.sx-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--faint); flex: none; }
.sx-step i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; display: grid; place-items: center; }
.sx-step i svg { width: 12px; height: 12px; stroke-width: 2.6; }
.sx-step.done { color: var(--ink-2); } .sx-step.done i { background: var(--accent); box-shadow: none; color: #fff; }
.sx-step.cur { color: var(--accent-2); } .sx-step.cur i { box-shadow: inset 0 0 0 5px var(--accent); }
.sx-line { flex: 1; height: 2px; min-width: 18px; margin: 0 10px; border-radius: 1px; background: var(--line-2); }
.sx-line.done { background: var(--accent); }
.sx-flag { margin-left: 14px; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 650; flex: none; background: color-mix(in srgb, var(--fc) 13%, var(--surface)); color: var(--fc); }
.sx-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 30px; padding: 26px 32px 28px; }
.sx-sec { margin-bottom: 26px; }
.sx-h { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.sx-h svg { width: 15px; height: 15px; color: var(--lc); }
.sx-lead { font-size: 17px; line-height: 1.55; color: var(--ink); margin: 0; max-width: 60ch; }
.sx-lead.sx-empty { color: var(--faint); font-size: 14px; }
.sx-steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.sx-steps li { position: relative; padding: 1px 0 14px 38px; font-size: 15.5px; line-height: 1.5; color: var(--ink); counter-increment: s; }
.sx-steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--lc) 14%, var(--surface)); color: color-mix(in srgb, var(--lc) 80%, var(--ink)); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.sx-steps li::after { content: ""; position: absolute; left: 11.5px; top: 28px; bottom: 2px; width: 1px; background: var(--line-2); }
.sx-steps li:last-child { padding-bottom: 0; } .sx-steps li:last-child::after { display: none; }
.sx-goal { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 16px; background: color-mix(in srgb, var(--good) 8%, var(--surface)); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--good) 28%, transparent); }
.sx-goal .ico { width: 38px; height: 38px; border-radius: 50%; background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); display: grid; place-items: center; flex: none; }
.sx-goal .ico svg { width: 20px; height: 20px; }
.sx-goal p { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; }
.sx-goal small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }

function fmtBig(v) { if (v >= 1e7) return (v / 1e7).toFixed(v >= 1e8 ? 0 : 2) + ' cr'; if (v >= 1e5) return (v / 1e5).toFixed(1) + ' L'; if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k'; return Math.round(v).toString(); }

// ------------------------------------------------------------------ model --
function buildScenario(plan) {
  const s = scenario(plan.scenario || 'base');
  const d = { ...DEFAULT_DRV, ...(plan.drv || {}) };
  s.mktMult *= d.mktMult; s.cacMult *= d.cacMult; s.churnMult *= d.churnMult; s.organicMult *= d.organicMult;
  s.convMult *= d.convMult; s.bookMult *= d.bookMult; s.b2bDelay += d.b2bDelayAdd; s.hiringMult *= d.hiringMult; s.gpuMult *= d.gpuMult;
  s.corpMult *= d.corpMult; s.corpDiscount = d.corpDiscount; s.corpTrigger = d.corpTrigger; s.chatMult *= d.chatMult;
  s.rounds[0].amount = d.seedAmt; s.rounds[1].month = d.aMonth; s.rounds[1].amount = d.aAmt; s.rounds[2].month = d.bMonth; s.rounds[2].amount = d.bAmt;
  s.defend = true;
  return s;
}
function computeModel(plan) {
  const s = buildScenario(plan), rows = run(s), m = metrics(s, rows);
  const first = f => { const i = rows.findIndex(f); return i < 0 ? null : i; };
  const ev = {
    launch: 0, corpLive: m.corpStart >= 0 ? m.corpStart : null, lakh: first(r => r.mauConsumer >= 1e5), tenLakh: first(r => r.mau >= 1e6), crore: first(r => r.mau >= 1e7),
    seriesA: s.rounds[1].month < 60 ? s.rounds[1].month : null, seriesB: s.rounds[2].month < 60 && s.rounds[2].amount > 0 ? s.rounds[2].month : null,
    minCash: m.minAt, breakeven: m.breakeven >= 0 ? m.breakeven : null, ownGpu: s.ownGpuMonth, insurerFirst: first(r => r.rInsurer > 0),
    stateFirst: first(r => r.rState > 0), llmFirst: first(r => r.rLlm > 0), pendant: s.pendantStart < 60 ? s.pendantStart : null,
  };
  const per = PERIODS.map(p => {
    if (p.start < 0 || p.start >= 60) return { ...p, empty: true };
    const R = rows.slice(p.start, Math.min(60, p.end)), last = R[R.length - 1];
    const sum = k => R.reduce((a, r) => a + r[k], 0);
    return { ...p, mau: last.mau, mauCorp: last.mauCorp, subs: last.subs, rev: sum('rev') / 1e7, ebitda: sum('ebitda') / 1e7, cash: last.cash / 1e7, hc: last.hcTotal, corp: last.corpClients, defending: R.some(r => r.defending) };
  });
  // Consumer cohorts: users acquired each month, kept by the same churn the model applies.
  const churn = rows.map(r => Math.min(0.5, s.churn[r.y] * s.churnMult));
  const newU = rows.map((r, t) => r.newPaid + r.newOrganic + (t === 0 ? s.mau0 : 0));
  const cohortOf = t => periodOfMonth(t);
  const cohortKeys = PERIODS.filter(p => p.start >= 0 && p.start < 60).map(p => p.key);
  const layers = {}; cohortKeys.forEach(k => layers[k] = new Array(60).fill(0));
  const surv = []; // surv[m][t] not stored; accumulate directly
  for (let mth = 0; mth < 60; mth++) { let alive = newU[mth]; const k = cohortOf(mth); for (let t = mth; t < 60; t++) { if (t > mth) alive *= (1 - churn[t]); layers[k][t] += alive; } }
  const cohorts = cohortKeys.map(k => {
    const p = PERIODS[PIDX[k]], size = newU.slice(p.start, p.end).reduce((a, b) => a + b, 0), end = Math.min(60, p.end) - 1;
    const at = n => end + n < 60 ? layers[k][end + n] / size : null;
    return { key: k, label: p.label, size, a3: at(3), a6: at(6), a12: at(12), dec31: layers[k][59] };
  });
  return { s, rows, m, ev, per, layers, cohortKeys, cohorts };
}
function gateMonth(item, M) {
  const g = item.gate; if (!g || !g.type) return undefined;
  if (g.type === 'event') { const t = M.ev[g.event]; return t == null ? null : t + (Number(g.offset) || 0); }
  if (g.type === 'reach') { const met = METRICS[g.metric]; if (!met) return null; const v = Number(g.value); const i = M.rows.findIndex(r => met.get(r) >= v); return i < 0 ? null : i + (Number(g.offset) || 0); }
  return undefined;
}
function placeOf(item) {
  const t = gateMonth(item, S.model);
  if (t === undefined) return { period: item.period || '2027Q1', auto: false };
  return { period: periodOfMonth(t), auto: true, month: t };
}
const activePlan = () => S.whatIf || S.plan;
function recompute() { S.model = computeModel(activePlan()); }

const laneOf = id => LANES.find(l => l.id === id) || LANES[0];

function tagGroups(it) {
  const G = { type: [], layer: [], plain: [] };
  (it.tags || []).forEach(id => { const t = S.tags.get(id); if (t) (G[t.group === 'type' || t.group === 'layer' ? t.group : 'plain']).push({ id, ...t }); });
  G.layer.sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
  return G;
}

function tagChip(id) { const t = S.tags.get(id); return t ? `<span class="tg"><i style="background:${esc(t.color || '#7A7D95')}"></i>${esc(t.label)}</span>` : ''; }

function matches(it) {
  const f = S.filters;

  if (f.owners.size && !f.owners.has(it.owner || 'none')) return false;
  if (f.status.size && !f.status.has(it.status)) return false;
  if (f.pri.size && !f.pri.has(it.priority)) return false;
  if (f.tags.size && !(it.tags || []).some(t => f.tags.has(t))) return false;
  if (f.q) { const q = f.q.toLowerCase(); if (![it.title, it.why, it.how, it.kpi].some(x => (x || '').toLowerCase().includes(q))) return false; }

}

  return PERIODS;
}
const byPlace = (a, b) => (PRI_RANK[a.it.priority] ?? 3) - (PRI_RANK[b.it.priority] ?? 3) || (a.pl.month ?? 0) - (b.pl.month ?? 0) || (a.it.order ?? 0) - (b.it.order ?? 0);
async function profilesFor(ids) {
  ids = [...new Set(ids.filter(Boolean))];
  if (!ids.length || !S.user) return {};
  try { const ps = await S.user.profiles(ids); Object.assign(S.profiles, ps); return ps; } catch (e) { return {}; }
}

function gateText(it) {
  const g = it.gate || {};
  const off = Number(g.offset) ? ` ${g.offset > 0 ? '+' : '−'} ${Math.abs(g.offset)} mo` : '';
  if (g.type === 'event') return `${EVENTS[g.event] || g.event}${off}`;
  if (g.type === 'reach') { const met = METRICS[g.metric]; return `${met ? met.label : g.metric} reaches ${fmtBig(Number(g.value))}${off}`; }
  return '';
}

// ------------------------------------------------------------- data layer --
async function logActivity(text) {
  if (!S.db) return;
  const entries = [{ t: Date.now(), by: S.me && S.me.id, text: String(text).slice(0, 200) }, ...S.activity].slice(0, 80);
  try { await S.db.doc('activity/feed').set({ entries }); } catch (e) {}
}
async function writeDoc(path, data, verb) {
  if (!S.db || !S.canEdit) { toast('This view is read only.'); return false; }
  try { await S.db.doc(path).set(data); if (verb) logActivity(verb); return true; }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'The board is full. Delete some cards first.' : 'Could not save. Try again.'); return false; }
}
async function patchDoc(path, patch, verb) {
  if (!S.db || !S.canEdit) { toast('This view is read only.'); return false; }
  try { await S.db.doc(path).update(patch); if (verb) logActivity(verb); return true; }

function withFlip(fn) {

  if (S.view === 'board' && !reduceMotion()) document.querySelectorAll('#boardScroll .card[data-id]').forEach(c => before.set(c.dataset.id, { r: c.getBoundingClientRect(), p: c.parentElement.dataset.period }));
  fn();
  if (!before.size) return;
  document.querySelectorAll('#boardScroll .card[data-id]').forEach(c => {
    const b = before.get(c.dataset.id); if (!b) return;
    const r = c.getBoundingClientRect(), dx = b.r.left - r.left, dy = b.r.top - r.top;

function renderBoard() {

// ----------------------------------------------------------------- risks --
function riskScore(r) { return (Number(r.likelihood) || 1) * (Number(r.impact) || 1); }
function riskProgress(r) { const ids = (r.items || []).filter(id => S.items.has(id)); if (!ids.length) return null; const done = ids.filter(id => S.items.get(id).status === 'done').length; return { done, n: ids.length }; }
function renderRisks() {
  const R = [...S.risks.values()].filter(r => !S.filters.owners.size || S.filters.owners.has(r.owner || 'none'));
  let heat = '';
  for (let l = 5; l >= 1; l--) {
    heat += `<div class="hax">${l}</div>`;
    for (let i = 1; i <= 5; i++) {
      const sc = l * i, bg = sc >= 15 ? 'color-mix(in srgb, var(--bad) 28%, var(--surface))' : sc >= 8 ? 'color-mix(in srgb, var(--warn) 24%, var(--surface))' : 'color-mix(in srgb, var(--good) 16%, var(--surface))';
      const here = R.filter(r => Number(r.likelihood) === l && Number(r.impact) === i && r.status !== 'closed');
      heat += `<div class="hc" style="background:${bg}">${here.map(r => `<button class="rbub" type="button" data-risk="${esc(r.id)}" title="${esc(r.title)}">${esc(r.short || r.title)}</button>`).join('')}</div>`;
    }
  }
  heat += `<div></div>${[1, 2, 3, 4, 5].map(i => `<div class="hax">${i}</div>`).join('')}`;
  const list = R.sort((a, b) => riskScore(b) - riskScore(a)).map(r => {
    const pr = riskProgress(r);

// ----------------------------------------------------------------- moats --
function moatSeries(key) {
  const M = S.model, rows = M.rows;
  if (key === 'memory') { let c = 0; return rows.map(r => (c += r.chats)); }
  if (key === 'model') return rows.map(r => r.chats ? r.cChat / r.chats : 0);
  if (key === 'supply') return rows.map(r => r.gmv * 12 / 1e7);
  if (key === 'distribution') return rows.map(r => r.seats);
  if (key === 'habit') return rows.map(r => r.subs);
  if (key === 'insurance') return rows.map(r => (r.rInsurer + r.rIns) * 12 / 1e7);
  if (key === 'ecosystem') return rows.map(r => r.rev ? (r.rMkt + r.rFit + r.rIns + r.rInsurer + r.rHw) / r.rev : 0);
  if (key === 'pendant') { let c = 0; return rows.map(r => (c += r.rHw ? M.s.pendantUnits[r.y] : 0)); }
  return null;
}
function renderMoats() {
  const pillars = [...S.moats.values()].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  const W = { done: 1, in_progress: .5, planned: .25, at_risk: .2, blocked: .1, idea: .05 };

  const rows = pillars.map(p => {
    const its = [...S.items.values()].filter(it => it.moat === p.id && it.status !== 'dropped').map(it => ({ it, pl: placeOf(it) }));

    const cells = years.map(y => {
      const inYear = its.filter(x => { const pp = PERIODS[PIDX[x.pl.period]]; return pp && (pp.year === y || (y === 2027 && pp.year === 2026)); });

    }).join('');

  }).join('');
  return `<div class="wrap view"><div class="vhead"><h2>Why we get <i>harder to copy</i> every year.</h2><p>Each pillar of defensibility, the cards that build it (filled = done) and a live number from the model. Give a card a moat pillar in its editor to place it here.</p></div>
    <div class="panel tbl-wrap"><div class="moat">${head}${rows || `<div style="grid-column:1/-1" class="empty">No pillars yet.</div>`}</div></div></div>`;

// ------------------------------------------------------------- decisions --

    if (S.pop) { const b = $(POP_BTN[S.pop]); closePop(); b.focus(); return; }
    if (sheetOpen()) { e.preventDefault(); return S.editing ? cancelEdit() : closeSheet(); }
    if (S.openHeader) { S.openHeader = null; document.querySelectorAll('.ph-pop').forEach(x => x.remove()); return; }
    if (e.target.id === 'q' && e.target.value) { e.target.value = ''; S.filters.q = ''; renderMainOnly(); }
    return;
  }
  if (sheetOpen()) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && S.editing && S.canEdit) { e.preventDefault(); return S.editing.type === 'risk' ? saveRisk() : saveItem(); }
    if (typing || S.editing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); return stepSheet(1, false); }
    if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); return stepSheet(-1, false); }
    if ((e.key === 'e' || e.key === 'E') && S.canEdit && S.sheet && S.sheet.id) { e.preventDefault(); return editItem(S.sheet.id); }
    return;
  }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && (e.target.classList.contains('card') || e.target.classList.contains('rrow') || e.target.classList.contains('ph'))) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.filters.q = t.value; clearTimeout(document.qT); document.qT = setTimeout(renderMainOnly, 140); return; }
  if (t.dataset && t.dataset.lv) return onLever(t.dataset.lv, Number(t.value));
  if (t.id === 'tjRange') { tjStop(); TJ.t = Number(t.value); return tjCursor(); }
  if (t.id === 'fConf') { $('oConf').textContent = t.value + '%'; return; }
  if (t.id === 'depFilter') { const q = t.value.toLowerCase(); document.querySelectorAll('#depList label').forEach(l => l.hidden = !l.textContent.toLowerCase().includes(q)); return; }
  if (t.dataset && t.dataset.dep && S.editing) { const d = S.editing.draft; d.deps = d.deps || []; if (t.checked) d.deps.push(t.dataset.dep); else d.deps = d.deps.filter(x => x !== t.dataset.dep); return; }
  if (S.editing && S.editing.type === 'item' && ['gEvent', 'gOff', 'gMetric', 'gVal', 'fPeriod', 'fKind'].includes(t.id)) { readDraft(); if (t.id === 'gMetric') $('gUnit').textContent = METRICS[t.value].unit; if (t.id === 'fKind') $('decFields').hidden = t.value !== 'decision'; refreshLands(); }
});
document.addEventListener('change', e => { if (e.target.id && ['gEvent', 'gMetric', 'fKind', 'fPeriod'].includes(e.target.id)) e.target.dispatchEvent(new Event('input', { bubbles: true })); });
window.addEventListener('resize', () => { if (sheetOpen()) placeSheet(); });
document.addEventListener('animationend', e => { if (e.animationName === 'moved') e.target.classList.remove('moved'); });
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card'); if (c) requestAnimationFrame(() => c.classList.add('dragging')); });
document.addEventListener('dragend', e => { document.querySelectorAll('.card.dragging').forEach(c => c.classList.remove('dragging')); });

// drag and drop
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {} });
document.addEventListener('dragover', e => { const cell = e.target.closest && e.target.closest('.cell'); if (!cell || !dragId) return; e.preventDefault(); document.querySelectorAll('.cell.over').forEach(x => x !== cell && x.classList.remove('over')); cell.classList.add('over'); });
document.addEventListener('dragleave', e => { const cell = e.target.closest && e.target.closest('.cell'); if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('over'); });
document.addEventListener('drop', async e => {
  const cell = e.target.closest && e.target.closest('.cell'); document.querySelectorAll('.cell.over').forEach(x => x.classList.remove('over'));
  if (!cell || !dragId) return; e.preventDefault();
  const it = S.items.get(dragId); const id = dragId; dragId = null; if (!it) return;
  if (it.gate && it.gate.type) { toast('The model places this card. Change its trigger in the card to move it.'); return; }
  const lane = cell.dataset.lane, period = cell.dataset.period;
  if (lane === it.lane && period === it.period) return;
  const patch = { lane, period, ...stamp() };
  if (it.endPeriod && PIDX[it.endPeriod] < PIDX[period]) patch.endPeriod = null;
  S.items.set(id, { ...it, ...patch }); renderMainOnly();
  await patchDoc('items/' + id, patch, `moved "${it.title}" to ${PERIODS[PIDX[period]].label}, ${LANES.find(l => l.id === lane).label}`);
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.cell.over').forEach(x => x.classList.remove('over')); });

async function exportBoard() {
  const data = { exportedAt: new Date().toISOString(), plan: S.plan, items: [...S.items.values()], risks: [...S.risks.values()], moats: [...S.moats.values()], tags: [...S.tags.values()] };
  const text = JSON.stringify(data, null, 2);
  if (S.downloads) { try { await S.downloads.save({ filename: 'cheeku-vision-board.json', data: text }); return; } catch (e) { if (e && e.code === 'cancelled') return; } }
  try { await navigator.clipboard.writeText(text); toast('Board copied as JSON'); } catch (e) { toast('Export is not available in this view.'); }
}


// ------------------------------------------------------------------ boot --
recompute(); route();
(async () => {
  const c = window.claude; if (!c || !c.use) { setSync(); return; }
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  S.db = db; S.user = user;
  if (user) { try { S.me = await user.me(); S.canEdit = !!S.me.canEdit; } catch (e) {} }
  setSync();
  if (db) subscribe();
  render();
  c.use('room').then(room => { S.room = room; if (!room) return; presence({}); room.onPeers(ch => { S.peers = ch.peers || []; renderPeers(); profilesFor(S.peers.map(p => p.by)).then(() => { if (S.view === 'board' || S.view === 'owners') scheduleRender(); }); }, () => {}); });
  c.use('comments').then(cm => { S.comments = cm; if (S.sheet && !S.editing) fillSheet(); });
  c.use('downloads').then(dl => { S.downloads = dl; });
})();
</script>
